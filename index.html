
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento Operacional - Entrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tipografia corporativa e cores */
        body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; color: #333; }
        .header-bg { background-color: #0d2545; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card { transition: box-shadow 0.2s; border-radius: 8px; }
        .card:hover { box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08); }
        textarea {
            resize: vertical;
            min-height: 120px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }
        .section-name { color: #0d2545; }
        .priority-select { border-radius: 6px; border: 1px solid #ccc; padding: 6px; }

        /* Estilo para a mensagem de feedback */
        #feedback-message {
            transition: opacity 0.5s, transform 0.5s;
        }
        .fade-in { opacity: 1; transform: translateY(0); }
        .fade-out { opacity: 0; transform: translateY(10px); }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        setLogLevel('debug'); // Ativa logs de debug para o Firestore

        // Variáveis Globais (fornecidas pelo ambiente Canvas)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth, userId;

        // Definição explícita de setores com ids que batem com os ids no HTML
        const SECTORS = [
            { id: 'moegas-recepcao', nome: 'MOEGAS/RECEPÇÃO' },
            { id: 'silos-e-pre-secagens', nome: 'SILOS E PRÉ-SECAGENS' },
            { id: 'silo-pulmao', nome: 'SILO PULMÃO' },
            { id: 'silos-de-repasse', nome: 'SILOS DE REPASSE' },
            { id: 'beneficiamento', nome: 'BENEFICIAMENTO' },
            { id: 'ensaque', nome: 'ENSAQUE' },
            { id: 'marcold', nome: 'MARCOLD' },
            { id: 'graneleiro-adriana', nome: 'GRANELEIRO ADRIANA' }
        ];
        
        // Local storage key (fallback)
        const LOCAL_STORAGE_KEY = `planning_draft_${appId}`;

        // --- Inicialização e Autenticação Firebase ---
        async function initializeFirebase() {
            if (!firebaseConfig) {
                console.warn("Firebase Config não fornecida — usando persistência local apenas.");
                loadStatusFromLocal();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                userId = auth.currentUser?.uid || crypto.randomUUID();
                console.log(`✅ Autenticação Firebase bem-sucedida. User ID: ${userId}`);
                await loadLastStatusFromFirestore();
            } catch (error) {
                console.error("❌ Falha na autenticação/inicialização Firebase:", error);
                // fallback para local
                loadStatusFromLocal();
            }
        }

        // --- Gerenciamento de Referências Firestore ---
        function getPlanningDocRefPrivate() {
            return doc(db, `artifacts/${appId}/users/${userId}/planning_data/current_status`);
        }

        function getPlanningDocRefPublic() {
            return doc(db, `artifacts/${appId}/public/data/planning_data/current_status`);
        }

        // --- Funções de Ajuda ---
        function getCurrentDateString() {
            const now = new Date();
            return now.toISOString().slice(0,10);
        }

        function showFeedback(message, isError = false) {
            const msgEl = document.getElementById('feedback-message');
            if (!msgEl) return;
            msgEl.textContent = message;
            msgEl.className = `p-3 rounded-md mt-4 font-semibold text-center fade-in ${isError ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}`;
            
            setTimeout(() => {
                msgEl.className = 'fade-out';
                setTimeout(() => { msgEl.textContent = ''; }, 500);
            }, 5000);
        }

        // --- Persistência local (fallback) ---
        function saveStatusToLocal(data) {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn("Não foi possível salvar no localStorage:", e);
            }
        }

        function loadStatusFromLocal() {
            try {
                const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (!data || !data.setores) return;
                data.setores.forEach(setor => {
                    const statusEl = document.getElementById(`status-${setor.id}`);
                    const priorityEl = document.getElementById(`priority-${setor.id}`);
                    if (statusEl) statusEl.value = setor.status || '';
                    if (priorityEl) priorityEl.value = setor.prioridade || 'NORMAL';
                });
                if (data.data) document.getElementById('data-ref').value = data.data;
                if (data.turno) document.getElementById('turno-ref').value = data.turno;
                showFeedback("Último rascunho local carregado.", false);
            } catch (e) {
                console.warn("Erro ao carregar rascunho local:", e);
            }
        }

        // --- Funções de Persistência Firestore ---
        async function loadLastStatusFromFirestore() {
            if (!db || !auth) return;
            try {
                const docRef = getPlanningDocRefPrivate();
                const docSnap = await getDoc(docRef);

                if (docSnap && docSnap.exists()) {
                    const data = docSnap.data();
                    if (data && data.setores) {
                        data.setores.forEach(setor => {
                            const statusEl = document.getElementById(`status-${setor.id}`);
                            const priorityEl = document.getElementById(`priority-${setor.id}`);
                            if (statusEl) statusEl.value = setor.status || '';
                            if (priorityEl) priorityEl.value = setor.prioridade || 'NORMAL';
                        });
                    }
                    if (data.data) document.getElementById('data-ref').value = data.data;
                    if (data.turno) document.getElementById('turno-ref').value = data.turno;
                    showFeedback("Último status de trabalho carregado do Firestore.", false);
                } else {
                    console.log("Nenhum status anterior encontrado no Firestore (private).");
                    loadStatusFromLocal();
                }
            } catch (error) {
                console.error("Erro ao carregar status do Firestore (private):", error);
                loadStatusFromLocal();
            }
        }

        async function saveStatusPrivate() {
            const formData = collectFormData(false);
            if (!formData) return;
            // salva local sempre
            saveStatusToLocal(formData);

            if (!db) return;
            try {
                await setDoc(getPlanningDocRefPrivate(), formData);
                console.log("Rascunho salvo no Firestore (private).");
            } catch (error) {
                console.error("Erro ao salvar rascunho no Firestore (private):", error);
            }
        }

        // --- Funções do Formulário ---
        function collectFormData(requireFull) {
            const dataRef = document.getElementById('data-ref')?.value || '';
            const turnoRef = document.getElementById('turno-ref')?.value || '';

            if (requireFull && (!dataRef || !turnoRef)) {
                return null;
            }

            const setoresData = SECTORS.map(s => {
                const id = s.id;
                const nome = s.nome;
                const statusEl = document.getElementById(`status-${id}`);
                const priorityEl = document.getElementById(`priority-${id}`);
                
                const status = statusEl ? statusEl.value.trim() : '';
                const prioridade = priorityEl ? priorityEl.value.toUpperCase() : 'NORMAL';

                if (requireFull && !status) return null;

                return {
                    id,
                    nome,
                    status,
                    prioridade
                };
            }).filter(item => item !== null);

            if (requireFull && setoresData.length === 0) return null;

            return {
                timestamp: Date.now(),
                data: dataRef,
                turno: turnoRef,
                setores: setoresData
            };
        }

        // Lógica de TRANSMISSÃO (Atualização de Status Público)
        async function handleTransmission(event) {
            event.preventDefault();
            
            const formData = collectFormData(true);
            if (!formData) {
                showFeedback("⚠️ Por favor, preencha a Data, o Turno e pelo menos um Status de Setor.", true);
                return;
            }

            // salva rascunho local e privado
            saveStatusToLocal(formData);
            await saveStatusPrivate();

            // tenta salvar público no Firestore
            if (!db) {
                showFeedback("⚠️ Salvo localmente. Firestore não inicializado.", false);
                return;
            }

            try {
                await setDoc(getPlanningDocRefPublic(), formData);
                showFeedback("🚀 Planejamento salvo e Dashboard COI atualizado com sucesso!", false);
            } catch (error) {
                console.error("Erro ao salvar público:", error);
                showFeedback(`❌ Erro ao salvar/atualizar o planejamento: ${error.message}`, true);
            }
        }

        // Limpa todos os campos do formulário
        function clearForm() {
            SECTORS.forEach(s => {
                const id = s.id;
                const statusEl = document.getElementById(`status-${id}`);
                const priorityEl = document.getElementById(`priority-${id}`);
                if (statusEl) statusEl.value = '';
                if (priorityEl) priorityEl.value = 'NORMAL';
            });
            document.getElementById('data-ref').value = getCurrentDateString();
            document.getElementById('turno-ref').value = 'TURNO 1';
            showFeedback("Formulário limpo e pronto para um novo preenchimento.", false);
            const draft = collectFormData(false);
            if (draft) saveStatusToLocal(draft);
            saveStatusPrivate();
        }
        
        // --- Setup Inicial ---
        document.addEventListener('DOMContentLoaded', () => {
            const dateEl = document.getElementById('data-ref');
            if (dateEl) dateEl.value = getCurrentDateString();

            document.getElementById('transmission-form')?.addEventListener('submit', handleTransmission);
            document.getElementById('clear-form-btn')?.addEventListener('click', clearForm);
            
            SECTORS.forEach(s => {
                const id = s.id;
                document.getElementById(`status-${id}`)?.addEventListener('input', saveStatusPrivate);
                document.getElementById(`priority-${id}`)?.addEventListener('change', saveStatusPrivate);
            });

            document.getElementById('data-ref')?.addEventListener('change', saveStatusPrivate);
            document.getElementById('turno-ref')?.addEventListener('change', saveStatusPrivate);
            
            initializeFirebase();
        });
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <form id="transmission-form">
        <!-- Cabeçalho Corporativo e Contexto -->
        <header class="header-bg p-4 sticky top-0 z-10">
            <h1 class="text-3xl font-extrabold flex items-center justify-center">
                <span class="mr-3">📋</span> Planejamento Operacional
            </h1>
            <!-- Seletores de Contexto -->
            <div class="flex flex-wrap justify-center gap-6 mt-4 p-3 bg-white/10 rounded-lg">
                <div class="flex items-center space-x-2">
                    <label for="data-ref" class="font-semibold">Data:</label>
                    <input type="date" id="data-ref" required 
                           class="p-2 rounded-md text-gray-900 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex items-center space-x-2">
                    <label for="turno-ref" class="font-semibold">Turno:</label>
                    <select id="turno-ref" required 
                            class="p-2 rounded-md text-gray-900 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="TURNO 1">Turno: A</option>
                        <option value="TURNO 2">Turno: B</option>
                        <option value="TURNO 3">Turno: C</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Conteúdo Principal - Setores -->
        <main class="max-w-6xl mx-auto p-6">
            <div id="feedback-message" class="fade-out" style="opacity: 0;"></div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Seções: IDs já batem com SECTORS -->
                <div class="card bg-white p-6 shadow-lg">
                    <h2 class="section-name text-2xl font-bold mb-4">MOEGAS/RECEPÇÃO</h2>
                    <textarea id="status-moegas-recepcao" placeholder="Descreva o status e os próximos passos para o setor."
                              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                    <label for="priority-moegas-recepcao" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label>
                    <select id="priority-moegas-recepcao" class="priority-select w-full mt-1">
                        <option value="NORMAL">Normal</option>
                        <option value="BAIXA">Baixa</option>
                        <option value="MÉDIA">Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>

                <div class="card bg-white p-6 shadow-lg">
                    <h2 class="section-name text-2xl font-bold mb-4">SILOS E PRÉ-SECAGENS</h2>
                    <textarea id="status-silos-e-pre-secagens" placeholder="Descreva o status e os próximos passos para o setor."
                              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                    <label for="priority-silos-e-pre-secagens" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label>
                    <select id="priority-silos-e-pre-secagens" class="priority-select w-full mt-1">
                        <option value="NORMAL">Normal</option>
                        <option value="BAIXA">Baixa</option>
                        <option value="MÉDIA">Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>

                <div class="card bg-white p-6 shadow-lg">
                    <h2 class="section-name text-2xl font-bold mb-4">SILO PULMÃO</h2>
                    <textarea id="status-silo-pulmao" placeholder="Descreva o status e os próximos passos para o setor."
                              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                    <label for="priority-silo-pulmao" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label>
                    <select id="priority-silo-pulmao" class="priority-select w-full mt-1">
                        <option value="NORMAL">Normal</option>
                        <option value="BAIXA">Baixa</option>
                        <option value="MÉDIA">Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>

                <div class="card bg-white p-6 shadow-lg">
                    <h2 class="section-name text-2xl font-bold mb-4">SILOS DE REPASSE</h2>
                    <textarea id="status-silos-de-repasse" placeholder="Descreva o status e os próximos passos para o setor."
                              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                    <label for="priority-silos-de-repasse" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label>
                    <select id="priority-silos-de-repasse" class="priority-select w-full mt-1">
                        <option value="NORMAL">Normal</option>
                        <option value="BAIXA">Baixa</option>
                        <option value="MÉDIA">Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>

                <div class="card bg-white p-6 shadow-lg">
                    <h2 class="section-name text-2xl font-bold mb-4">BENEFICIAMENTO</h2>
                    <textarea id="status-beneficiamento" placeholder="Descreva o status e os próximos passos para o setor."
                              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                    <label for="priority-beneficiamento" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label>
                    <select id="priority-beneficiamento" class="priority-select w-full mt-1">
                        <option value="NORMAL">Normal</option>
                        <option value="BAIXA">Baixa</option>
                        <option value="MÉDIA">Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>

                <div class="card bg-white p-6 shadow-lg">
                    <h2 class="section-name text-2xl font-bold mb-4">ENSAQUE</h2>
                    <textarea id="status-ensaque" placeholder="Descreva o status e os próximos passos para o setor."
                              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                    <label for="priority-ensaque" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label>
                    <select id="priority-ensaque" class="priority-select w-full mt-1">
                        <option value="NORMAL">Normal</option>
                        <option value="BAIXA">Baixa</option>
                        <option value="MÉDIA">Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>

                <div class="card bg-white p-6 shadow-lg">
                    <h2 class="section-name text-2xl font-bold mb-4">MARCOLD</h2>
                    <textarea id="status-marcold" placeholder="Descreva o status e os próximos passos para o setor."
                              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                    <label for="priority-marcold" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label>
                    <select id="priority-marcold" class="priority-select w-full mt-1">
                        <option value="NORMAL">Normal</option>
                        <option value="BAIXA">Baixa</option>
                        <option value="MÉDIA">Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>

                <div class="card bg-white p-6 shadow-lg">
                    <h2 class="section-name text-2xl font-bold mb-4">GRANELEIRO ADRIANA</h2>
                    <textarea id="status-graneleiro-adriana" placeholder="Descreva o status e os próximos passos para o setor."
                              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                    <label for="priority-graneleiro-adriana" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label>
                    <select id="priority-graneleiro-adriana" class="priority-select w-full mt-1">
                        <option value="NORMAL">Normal</option>
                        <option value="BAIXA">Baixa</option>
                        <option value="MÉDIA">Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                </div>
            </div>
            
            <!-- Botões de Ação -->
            <div class="mt-8 flex justify-center space-x-4">
                <button type="button" id="clear-form-btn"
                        class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 bg-white hover:bg-gray-100 transition duration-150 shadow-sm font-semibold">
                    Limpar Formulário
                </button>
                <button type="submit"
                        class="px-8 py-3 rounded-lg text-white bg-green-600 hover:bg-green-700 transition duration-150 shadow-lg font-bold">
                    Salvar e Atualizar Planejamento
                </button>
            </div>
        </main>
    </form>
</body>
</html>
