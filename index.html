<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Planejamento Operacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100">

    <div id="app-container" class="min-h-screen flex items-center justify-center">
        
        <!-- Tela de Login (Padrão) -->
        <div id="login-screen" class="w-full max-w-md">
            <div class="bg-white p-8 rounded-xl shadow-2xl border-t-4 border-blue-600">
                <div class="flex justify-center mb-6">
                    <img src="img/logo-2021.png" alt="Logo da Empresa" class="h-16">
                </div>
                <h2 class="text-3xl font-bold text-slate-800 text-center mb-2">
                    Acesso Restrito
                </h2>
                <p class="text-center text-slate-500 mb-8">Interface de Planejamento Operacional</p>
                
                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            required
                            class="mt-1 block w-full px-4 py-3 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                            placeholder="seu.email@exemplo.com"
                        />
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700">Senha</label>
                        <input
                            type="password"
                            id="password"
                            required
                            class="mt-1 block w-full px-4 py-3 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                            placeholder="••••••••"
                        />
                    </div>
                    
                    <div id="error-message" class="text-red-600 text-sm text-center font-semibold" style="display: none;"></div>
                    
                    <div>
                        <button
                            type="submit"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                        >
                            Entrar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tela de Carregamento (Oculta) -->
        <div id="loading-screen" style="display: none;">
            <p class="text-xl font-semibold text-slate-600 animate-pulse">Verificando sessão...</p>
        </div>

    </div>

    <script type="module">
        // Importações do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { FIREBASE_CONFIG } from "./firebase_config.js";

        // Inicializa Firebase
        const app = initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);

        // Elementos do DOM
        const loginScreen = document.getElementById('login-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');

        // Função para mostrar erro
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // Função para esconder erro
        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Gerenciador de estado de autenticação
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Se o usuário já está logado, redireciona para a Interface A
                window.location.href = 'interfaceA.html';
            } else {
                // Se não há usuário, mostra a tela de login e esconde o carregamento
                loadingScreen.style.display = 'none';
                loginScreen.style.display = 'block';
            }
        });

        // Gerenciador de submit do formulário
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // O onAuthStateChanged vai cuidar do redirecionamento
            } catch (err) {
                console.error("Erro de Autenticação:", err.code);
                if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
                    showError("E-mail ou senha inválidos. Tente novamente.");
                } else if (err.code === "auth/operation-not-allowed") {
                    showError("Login por E-mail/Senha não está ativado no Console do Firebase.");
                } else {
                    showError("Falha na autenticação. Verifique o console para mais detalhes.");
                }
            }
        });

        // Exibe a tela de carregamento inicialmente
        loadingScreen.style.display = 'block';
        loginScreen.style.display = 'none';

    </script>

</body>
</html>
