<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard COI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,sans-serif;background:#f0f4f8;color:#333}
.header-bg{background:#0d2545;color:#fff}
.card{border-radius:8px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 20px rgba(0,0,0,.1)}
.priority-alta{color:#e74c3c;font-weight:700;border-left:5px solid #e74c3c}
.priority-media{color:#f39c12;font-weight:700;border-left:5px solid #f39c12}
.priority-baixa{color:#2ecc71;font-weight:700;border-left:5px solid #2ecc71}
.priority-normal{color:#3498db;font-weight:700;border-left:5px solid #3498db}
.status-header{border-bottom:2px solid #ecf0f1;margin-bottom:10px;padding-bottom:8px}
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<header class="header-bg p-4 flex justify-between items-center sticky top-0 z-10">
  <h1 class="text-3xl font-extrabold flex items-center"><span role="img" aria-label="Chart increasing" class="mr-3">📊</span> Dashboard COI - Planejamento Operacional</h1>
  <div class="flex flex-col text-right text-sm">
    <span id="status-conexao" class="font-medium text-yellow-400">INICIALIZANDO...</span>
    <span class="mt-1">Data: <span id="data-planejamento" class="font-semibold">N/A</span> | Turno: <span id="turno-planejamento" class="font-semibold">N/A</span> | Última Atualização: <span id="ultima-atualizacao" class="font-semibold">N/A</span></span>
  </div>
</header>
<main class="p-8">
  <div id="dashboard-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <p class="text-center text-gray-500 p-8 col-span-full">Aguardando inicialização e dados do Firebase...</p>
  </div>
</main>

<script>
const LOCAL_KEY = 'planning_data';

function getPriorityClass(priority) {
    const p = (priority || '').toLowerCase();
    if (p.includes('alta')) return 'priority-alta bg-white';
    if (p.includes('média') || p.includes('media')) return 'priority-media bg-white';
    if (p.includes('baixa')) return 'priority-baixa bg-white';
    return 'priority-normal bg-white';
}

function updateDashboard(data) {
    document.getElementById('data-planejamento').textContent = data.data || 'N/A';
    document.getElementById('turno-planejamento').textContent = data.turno || 'N/A';
    document.getElementById('ultima-atualizacao').textContent = new Date(data.timestamp).toLocaleString('pt-BR') || 'N/A';

    const setores = data.setores || [];
    const orderMap = { 'ALTA': 1, 'MÉDIA': 2, 'BAIXA': 3, 'NORMAL': 4 };
    setores.sort((a, b) => (orderMap[(a.prioridade || 'NORMAL').toUpperCase()] || 99) - (orderMap[(b.prioridade || 'NORMAL').toUpperCase()] || 99));

    const container = document.getElementById('dashboard-content');
    let html = '';
    setores.forEach(s => {
        html += `<div class="card p-6 ${getPriorityClass(s.prioridade)}">
            <div class="status-header flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-[#0d2545]">${s.nome}</h3>
                <span class="text-lg font-bold">Prioridade: ${(s.prioridade || 'NORMAL').toUpperCase()}</span>
            </div>
            <p class="whitespace-pre-wrap text-gray-700 leading-relaxed min-h-[100px]">${s.status || ''}</p>
        </div>`;
    });
    container.innerHTML = html;
}

function loadFromLocalStorage() {
    const statusIndicator = document.getElementById('status-conexao');
    try {
        const rawData = localStorage.getItem(LOCAL_KEY);
        if (rawData) {
            const data = JSON.parse(rawData);
            updateDashboard(data);
            statusIndicator.textContent = 'DADOS CARREGADOS LOCALMENTE';
            statusIndicator.className = 'text-green-500 font-bold';
        } else {
            statusIndicator.textContent = 'NENHUM DADO ENCONTRADO';
            statusIndicator.className = 'text-yellow-500 font-bold';
            document.getElementById('dashboard-content').innerHTML = '<p class="text-center text-gray-500 p-8">Nenhum dado de planejamento encontrado. Use a <a href="./operacional_planning_input.html" class="text-blue-500 underline">Interface de Entrada</a> para transmitir dados.</p>';
        }
    } catch (e) {
        console.error('Falha ao carregar dados do localStorage', e);
        statusIndicator.textContent = 'ERRO AO CARREGAR DADOS';
        statusIndicator.className = 'text-red-500 font-bold';
    }
}

window.onload = loadFromLocalStorage;
</script>
</body>
</html>
