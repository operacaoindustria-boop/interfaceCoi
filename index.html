<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard do COI (Visualização em Tempo Real)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tipografia corporativa e cores */
        body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; color: #333; }
        .header-bg { background-color: #0d2545; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card { transition: transform 0.2s, box-shadow 0.2s; border-radius: 8px; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1); }
        .priority-alta { color: #e74c3c; font-weight: 700; border-left: 5px solid #e74c3c; }
        .priority-media { color: #f39c12; font-weight: 700; border-left: 5px solid #f39c12; }
        .priority-baixa { color: #2ecc71; font-weight: 700; border-left: 5px solid #2ecc71; }
        .priority-normal { color: #3498db; font-weight: 700; border-left: 5px solid #3498db; }
        .status-header { border-bottom: 2px solid #ecf0f1; margin-bottom: 10px; padding-bottom: 8px; }
        .last-update { font-size: 0.75rem; color: #95a5a6; }
    </style>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        setLogLevel('debug'); // Ativa logs de debug para o Firestore
        
        // Variáveis Globais (fornecidas pelo ambiente Canvas)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth;
        let isAuthReady = false;

        // Inicialização e Autenticação Firebase
        async function initializeFirebase() {
            if (!firebaseConfig) {
                console.error("Firebase Config não encontrada.");
                return;
            }

            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // Tenta autenticar com token ou anonimamente
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                console.log("✅ Autenticação Firebase bem-sucedida.");
            } catch (error) {
                console.error("❌ Falha na autenticação Firebase:", error);
            }
            
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    console.log(`Usuário autenticado: ${user.uid}`);
                } else {
                    console.log("Usuário desautenticado.");
                }
                isAuthReady = true;
                listenToPlanningData(); // Começa a escutar após a autenticação
            });
        }

        // Obtém a referência do documento público
        function getPlanningDocRef() {
            // Caminho público: artifacts/{appId}/public/data/planning_data/current_status
            // Garantindo 6 segmentos (par)
            return doc(db, `artifacts/${appId}/public/data/planning_data/current_status`);
        }

        // Função para escutar mudanças nos dados do planejamento
        function listenToPlanningData() {
            if (!db || !isAuthReady) {
                console.warn("Aguardando inicialização do Firebase e autenticação.");
                return;
            }

            const docRef = getPlanningDocRef();
            const statusIndicator = document.getElementById('status-conexao');

            // onSnapshot: Atualiza em tempo real sempre que os dados mudam no Firestore
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    statusIndicator.textContent = "CONECTADO: Dados atualizados.";
                    statusIndicator.className = 'text-green-500 font-bold';
                    updateDashboard(data);
                } else {
                    statusIndicator.textContent = "CONECTADO: Aguardando primeira transmissão...";
                    statusIndicator.className = 'text-yellow-500 font-bold';
                    document.getElementById('dashboard-content').innerHTML = '<p class="text-center text-gray-500 p-8">Nenhum dado de planejamento encontrado. Por favor, utilize a Interface de Entrada (A) para transmitir o primeiro status operacional.</p>';
                }
            }, (error) => {
                console.error("Erro ao escutar dados do Firestore:", error);
                statusIndicator.textContent = "ERRO: Falha na conexão Firestore.";
                statusIndicator.className = 'text-red-500 font-bold';
            });
        }

        // --- Funções de Renderização e Lógica do Dashboard ---

        // Mapeia prioridades para classes Tailwind (para cores)
        function getPriorityClass(priority) {
            const normalizedPriority = priority ? priority.toLowerCase() : 'normal';
            switch (normalizedPriority) {
                case 'alta': return 'priority-alta bg-white';
                case 'média': return 'priority-media bg-white';
                case 'baixa': return 'priority-baixa bg-white';
                default: return 'priority-normal bg-white';
            }
        }

        // Função principal para atualizar o Dashboard com novos dados
        function updateDashboard(data) {
            const contentContainer = document.getElementById('dashboard-content');
            
            // 1. Atualizar Header
            document.getElementById('data-planejamento').textContent = data.data || 'N/A';
            document.getElementById('turno-planejamento').textContent = data.turno || 'N/A';
            document.getElementById('ultima-atualizacao').textContent = new Date(data.timestamp).toLocaleString('pt-BR') || 'N/A';
            
            // 2. Processar e Ordenar Setores
            const setores = data.setores || [];

            // A alta gestão sempre visualiza a prioridade mais alta primeiro
            const orderMap = { 'ALTA': 1, 'MÉDIA': 2, 'BAIXA': 3, 'NORMAL': 4 };
            setores.sort((a, b) => {
                const priorityA = orderMap[a.prioridade.toUpperCase()] || 99;
                const priorityB = orderMap[b.prioridade.toUpperCase()] || 99;
                return priorityA - priorityB;
            });

            // 3. Renderizar Setores
            let htmlContent = '';
            setores.forEach(setor => {
                htmlContent += `
                    <div class="card p-6 ${getPriorityClass(setor.prioridade)}">
                        <div class="status-header flex justify-between items-center mb-4">
                            <h3 class="text-xl font-semibold text-[#0d2545]">${setor.nome}</h3>
                            <span class="text-lg font-bold">
                                Prioridade: ${setor.prioridade.toUpperCase()}
                            </span>
                        </div>
                        <p class="whitespace-pre-wrap text-gray-700 leading-relaxed min-h-[100px]">${setor.status}</p>
                    </div>
                `;
            });

            contentContainer.innerHTML = htmlContent;
        }

        // Inicia o processo
        window.onload = initializeFirebase;
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Cabeçalho Corporativo -->
    <header class="header-bg p-4 flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-3xl font-extrabold flex items-center">
            <span class="mr-3">📊</span> Dashboard COI - Planejamento Operacional
        </h1>
        <div class="flex flex-col text-right text-sm">
            <span id="status-conexao" class="font-medium text-yellow-400">INICIALIZANDO...</span>
            <span class="mt-1">
                Data: <span id="data-planejamento" class="font-semibold">N/A</span> |
                Turno: <span id="turno-planejamento" class="font-semibold">N/A</span> |
                Última Atualização: <span id="ultima-atualizacao" class="font-semibold">N/A</span>
            </span>
        </div>
    </header>

    <!-- Container Principal do Dashboard -->
    <main class="p-8">
        <div id="dashboard-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Os cards de status serão injetados aqui via JavaScript -->
            <p class="text-center text-gray-500 p-8 col-span-full">Aguardando inicialização e dados do Firebase...</p>
        </div>
    </main>
</body>
</html>
