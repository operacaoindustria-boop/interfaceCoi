<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Agro - Dashboard de Gestão</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STORAGE_KEY = 'mes_agro_data';

        // Dados padrão para iniciar caso o armazenamento esteja vazio
        const generateSilos = (count, prefix, type) => Array.from({ length: count }, (_, i) => ({
            id: `${prefix}-${i + 1}`,
            name: `${type} ${i + 1}`,
            type: type,
            temp: '0.0', umidade: '0.0', urAr: '0.0', cultura: 'Vazio', status: 'normal', lastUpdate: '-'
        }));

        const INITIAL_DATA = {
            preSecagem: generateSilos(10, 'PS', 'Pré-Secagem'),
            armazenamento: generateSilos(20, 'AZ', 'Armazenamento'),
            metalicos: generateSilos(10, 'MT', 'Metálico'),
        };

        const Icons = {
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Factory: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/></svg>,
            ArrowLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        };

        const Dashboard = () => {
            const [data, setData] = useState(INITIAL_DATA);
            const [lastSync, setLastSync] = useState(new Date());

            // --- Lógica de Sincronização em Tempo Real ---
            const loadData = () => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    setData(JSON.parse(saved));
                    setLastSync(new Date());
                }
            };

            useEffect(() => {
                loadData(); // Carga inicial

                // Escuta eventos de outros arquivos/abas atualizando o localStorage
                const handleStorageChange = (e) => {
                    if (e.key === STORAGE_KEY) {
                        loadData();
                    }
                };
                window.addEventListener('storage', handleStorageChange);

                // Fallback: Polling a cada 2 segundos (garantia extra)
                const interval = setInterval(loadData, 2000);

                return () => {
                    window.removeEventListener('storage', handleStorageChange);
                    clearInterval(interval);
                };
            }, []);

            // --- Cálculos de KPI ---
            const stats = useMemo(() => {
                const allSilos = [...data.preSecagem, ...data.armazenamento, ...data.metalicos];
                const filled = allSilos.filter(s => s.cultura !== 'Vazio');
                
                const tempAvg = filled.length ? (filled.reduce((acc, curr) => acc + parseFloat(curr.temp), 0) / filled.length).toFixed(1) : 0;
                const umidAvg = filled.length ? (filled.reduce((acc, curr) => acc + parseFloat(curr.umidade), 0) / filled.length).toFixed(1) : 0;
                const critical = allSilos.filter(s => s.status === 'critical').length;
                const warning = allSilos.filter(s => s.status === 'warning').length;

                return { total: allSilos.length, filled: filled.length, tempAvg, umidAvg, critical, warning };
            }, [data]);

            // --- Componentes Visuais ---
            const KpiCard = ({ title, value, subtext, color, icon }) => (
                <div className={`bg-slate-800 p-6 rounded-xl border-t-4 ${color} shadow-lg`}>
                    <div className="text-slate-400 text-sm font-medium uppercase tracking-wider mb-2">{title}</div>
                    <div className="text-3xl font-bold text-white mb-1">{value}</div>
                    <div className="text-xs text-slate-500">{subtext}</div>
                </div>
            );

            const SiloDot = ({ silo }) => {
                let statusColor = "bg-slate-700 border-slate-600"; // Vazio
                let glow = "";
                
                if (silo.cultura !== 'Vazio') {
                    statusColor = "bg-emerald-500 border-emerald-400"; // Normal
                    if (silo.status === 'warning') statusColor = "bg-amber-500 border-amber-400";
                    if (silo.status === 'critical') {
                        statusColor = "bg-rose-500 border-rose-400";
                        glow = "animate-pulse shadow-[0_0_10px_rgba(244,63,94,0.6)]";
                    }
                }

                return (
                    <div className="group relative flex flex-col items-center">
                        <div className={`w-10 h-16 rounded-t-lg rounded-b-md border-2 transition-all duration-300 ${statusColor} ${glow}`}></div>
                        <span className="text-[10px] mt-1 text-slate-500 font-mono">{silo.id.split('-')[1]}</span>
                        
                        {/* Tooltip Hover */}
                        <div className="absolute bottom-full mb-3 hidden group-hover:block z-50 w-56 bg-white text-slate-800 p-3 rounded-lg shadow-xl text-xs pointer-events-none transform -translate-x-1/2 left-1/2">
                            <div className="font-bold text-sm border-b pb-1 mb-2 text-slate-900">{silo.name}</div>
                            <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                                <span className="text-slate-500">Status:</span> <span className="font-medium capitalize">{silo.status}</span>
                                <span className="text-slate-500">Cultura:</span> <span className="font-medium">{silo.cultura}</span>
                                <span className="text-slate-500">Temp:</span> <span className={`font-bold ${silo.status === 'critical' ? 'text-red-600' : ''}`}>{silo.temp}°C</span>
                                <span className="text-slate-500">Umidade:</span> <span className="font-bold">{silo.umidade}%</span>
                                <span className="text-slate-500">Última:</span> <span>{silo.lastUpdate}</span>
                            </div>
                            <div className="mt-2 text-[10px] italic text-slate-400 border-t pt-1">{silo.cultivar}</div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-8 animate-fade-in">
                    <header className="flex justify-between items-end mb-10 border-b border-slate-700 pb-6">
                        <div className="flex items-center gap-6">
                             <a href="menu.html" className="group p-3 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 hover:border-slate-500 text-slate-400 hover:text-white transition-all flex flex-col items-center justify-center w-16 h-16 shadow-lg">
                                <Icons.ArrowLeft />
                                <span className="text-[10px] mt-1 font-medium group-hover:text-blue-300">Menu</span>
                            </a>
                            <div>
                                <h1 className="text-3xl font-bold text-white flex items-center gap-3">
                                    <Icons.Factory /> MES Agro Dashboard
                                </h1>
                                <p className="text-slate-400 mt-2">Visão Geral da Planta - Tempo Real</p>
                            </div>
                        </div>
                        <div className="text-right">
                            <div className="text-xs text-slate-500 uppercase tracking-widest mb-1">Última Sincronização</div>
                            <div className="font-mono text-emerald-400">{lastSync.toLocaleTimeString()}</div>
                        </div>
                    </header>

                    {/* KPIs */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                        <KpiCard 
                            title="Ocupação" 
                            value={`${stats.filled} / ${stats.total}`} 
                            subtext="Silos com carga" 
                            color="border-blue-500" 
                        />
                        <KpiCard 
                            title="Temp. Média" 
                            value={`${stats.tempAvg}°C`} 
                            subtext="Massa de grãos" 
                            color="border-indigo-500" 
                        />
                        <KpiCard 
                            title="Umidade Média" 
                            value={`${stats.umidAvg}%`} 
                            subtext="Teor de água" 
                            color="border-teal-500" 
                        />
                        <KpiCard 
                            title="Pontos de Atenção" 
                            value={stats.critical + stats.warning} 
                            subtext={`${stats.critical} Críticos | ${stats.warning} Alertas`} 
                            color={stats.critical > 0 ? "border-rose-600" : "border-amber-500"} 
                        />
                    </div>

                    {/* Mapa de Silos */}
                    <div className="bg-slate-900 rounded-2xl p-8 border border-slate-700/50 shadow-2xl">
                        <div className="flex items-center gap-2 mb-8">
                            <Icons.Activity className="text-emerald-400"/>
                            <h2 className="text-xl font-bold text-white">Monitoramento dos Setores</h2>
                        </div>

                        <div className="space-y-10">
                            {/* Pré Secagem */}
                            <div>
                                <h3 className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4 border-l-4 border-slate-700 pl-3">Pré-Secagem</h3>
                                <div className="flex flex-wrap gap-4 bg-slate-800/50 p-6 rounded-xl border border-slate-700/30">
                                    {data.preSecagem.map(s => <SiloDot key={s.id} silo={s} />)}
                                </div>
                            </div>

                            {/* Metálicos e Armazenamento - Lado a Lado se houver espaço */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div>
                                    <h3 className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4 border-l-4 border-slate-700 pl-3">Silos Metálicos</h3>
                                    <div className="flex flex-wrap gap-4 bg-slate-800/50 p-6 rounded-xl border border-slate-700/30">
                                        {data.metalicos.map(s => <SiloDot key={s.id} silo={s} />)}
                                    </div>
                                </div>
                                <div>
                                    <h3 className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4 border-l-4 border-slate-700 pl-3">Armazenamento Final</h3>
                                    <div className="flex flex-wrap gap-4 bg-slate-800/50 p-6 rounded-xl border border-slate-700/30">
                                        {data.armazenamento.map(s => <SiloDot key={s.id} silo={s} />)}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="mt-8 flex justify-center gap-8 text-xs text-slate-400 border-t border-slate-800 pt-6">
                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-slate-700 border border-slate-600"></div> Vazio</div>
                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-emerald-500"></div> Normal</div>
                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-amber-500"></div> Atenção (>30°C)</div>
                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></div> Crítico (>35°C)</div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
