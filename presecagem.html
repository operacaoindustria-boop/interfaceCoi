<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Agro - Interface Operacional</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, writeBatch, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { firebaseConfig } from './firebase_config.js';

        // --- Inicialização Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect } = React;

        // --- Configuração Inicial e Utilitários ---
        // const STORAGE_KEY = 'mes_agro_data'; // Depreciado em favor do Firestore

        const generateSilos = (count, prefix, type) => {
            return Array.from({ length: count }, (_, i) => ({
                id: `${prefix}-${i + 1}`,
                name: `${type} ${i + 1}`,
                type: type,
                temp: (20 + Math.random() * 10).toFixed(1),
                umidade: (12 + Math.random() * 4).toFixed(1),
                cultura: 'Vazio',
                cultivar: '',
                pesoCargaKg: 0,
                coleta: '',
                lastUpdate: new Date().toLocaleTimeString(),
                status: 'normal'
            }));
        };

        // Dados iniciais apenas para popular o banco na primeira execução
        const SEED_DATA = [
            ...generateSilos(10, 'PS', 'Pré-Secagem'),
            ...generateSilos(20, 'AZ', 'Armazenamento'),
            ...generateSilos(10, 'MT', 'Metálico')
        ];

        // --- Ícones ---
        const Icons = {
            Thermometer: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" /><path d="M15 2h-6" /></svg>,
            Droplet: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-6-9-7-9S5 8 5 15a7 7 0 0 0 7 7Z" /><path d="m9 12 2 2 4-4" /></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" /></svg>,
            Save: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></svg>,
            ArrowLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>,
            Scale: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="M7 21h10" /><path d="M12 3v18" /><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></svg>,
            Wind: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2" /><path d="M9.6 4.6A2 2 0 1 1 11 8H2" /><path d="M12.6 19.4A2 2 0 1 0 14 16H2" /></svg>,
            Fire: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" /></svg>,
            Transfer: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 20V10a3 3 0 0 1 6 0v10" /><path d="M3 10a3 3 0 0 1 6 0" /><path d="M3 20h6" /><path d="M15 20V10a3 3 0 0 1 6 0v10" /><path d="M15 10a3 3 0 0 1 6 0" /><path d="M15 20h6" /><path d="M9 14h6" /><path d="m12 11 3 3-3 3" /></svg>,
            Cooling: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="2" y1="12" x2="22" y2="12" /><line x1="12" y1="2" x2="12" y2="22" /><path d="m20 16-4-4 4-4" /><path d="m4 8 4 4-4 4" /><path d="m16 4-4 4-4-4" /><path d="m8 20 4-4 4 4" /></svg>,
            Discharge: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M6 20V10a6 6 0 1 1 12 0v10" /><path d="M6 10a6 6 0 0 1 12 0" /><path d="M6 20h12" /><path d="M12 20v-4" /><path d="m10 18 2 2 2-2" /></svg>,
            Trash: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>
        };

        // --- Componentes ---
        const SiloCard = ({ silo, onClick, airHumidity, airHumidityError, onSetDrying }) => {
            const getStatusColor = () => {
                if (silo.status === 'critical' || parseFloat(silo.temp) > 35 || parseFloat(silo.umidade) > 16) return 'bg-red-50 border-red-400 text-red-900';
                if (silo.status === 'warning' || silo.status === 'drying' || parseFloat(silo.temp) > 30 || parseFloat(silo.umidade) > 14) return 'bg-yellow-50 border-yellow-400 text-yellow-900';
                if (silo.cultura === 'Vazio' || !silo.cultura) return 'bg-white border-gray-300 text-gray-500';
                return 'bg-green-50 border-green-400 text-green-900';
            };

            // Recupera o peso considerando possíveis variações de nome de campo vindos da Moega (peso, pesoLiquido)
            const peso = parseFloat(silo.pesoCargaKg || silo.peso || silo.pesoLiquido || 0);
            const tonnage = peso ? (peso / 1000).toFixed(2) : '0.00';
            const hasProduct = silo.cultura && silo.cultura !== 'Vazio';
            const displayAirHumidity = airHumidityError ? '--' : (airHumidity ?? '--');
            const humidityTitle = airHumidityError ? `Erro API: ${airHumidityError}` : "Umidade Relativa do Ar";
            const displayUmidade = hasProduct ? silo.umidade : '0.0';
            const displayTemp = hasProduct ? silo.temp : '0.0';

            const handleDryingClick = (e) => {
                e.stopPropagation(); // Impede que o modal de edição abra
                onSetDrying(silo);
            };

            return (
                <div
                    onClick={() => onClick(silo)}
                    className={`p-4 rounded-lg border-l-4 shadow-sm cursor-pointer hover:shadow-md hover:scale-[1.02] transition-all ${getStatusColor()}`}
                >
                    <div className="flex justify-between items-center mb-3">
                        <span className="font-bold text-lg">{silo.name}</span>
                        <div className="flex items-center gap-1">
                            <button onClick={handleDryingClick} title="Marcar como Secando" className={`p-1.5 rounded-full hover:bg-orange-100 transition-colors ${silo.status === 'drying' ? 'text-orange-500 bg-orange-100' : 'text-slate-400 hover:text-orange-500'}`}>
                                <Icons.Fire className="w-4 h-4" />
                            </button>
                            <span className={`text-xs px-2 py-1 rounded font-medium border ${!hasProduct ? 'bg-slate-100 text-slate-500 border-slate-300' : 'bg-white/60 border-black/10'}`}>
                                {silo.cultura || 'Vazio'}
                            </span>
                        </div>
                    </div>

                    {hasProduct && silo.cultivar && (
                        <div className="mb-2 text-xs font-semibold text-slate-600 bg-slate-200/50 px-2 py-1 rounded-md inline-block">
                            {silo.cultivar}
                        </div>
                    )}

                    <div className="grid grid-cols-3 gap-2 text-sm font-medium mt-1">
                        <div className="flex items-center gap-1" title={humidityTitle}><Icons.Wind /> {displayAirHumidity}%</div>
                        <div className="flex items-center gap-1"><Icons.Thermometer /> {displayTemp}°C</div>
                        <div className="flex items-center gap-1"><Icons.Droplet /> {displayUmidade}%</div>
                        <div className="flex items-center gap-1" title="Peso da última carga"><Icons.Scale /> {tonnage} t</div>
                    </div>

                    <div className="mt-3 text-[10px] uppercase tracking-wide opacity-70">
                        Atualizado: {silo.lastUpdate}
                    </div>
                </div>
            );
        };

        const ColetaDetalhadaModal = ({ isOpen, onClose, onSave, coletaNumero }) => {
            if (!isOpen) return null;

            const [furos, setFuros] = useState([
                { id: 1, temp: '', umidade: '' },
                { id: 2, temp: '', umidade: '' },
                { id: 3, temp: '', umidade: '' },
                { id: 4, temp: '', umidade: '' },
            ]);
            const [dataColeta, setDataColeta] = useState(() => new Date().toISOString().slice(0, 16));
            const [extras, setExtras] = useState({
                mesclador: { temp: '', umidade: '' },
                topo: { temp: '', umidade: '' },
                media: { temp: '', umidade: '' },
                usuario: ''
            });

            // Cálculo automático da média sempre que os dados dos furos mudarem
            useEffect(() => {
                const temps = furos.map(f => parseFloat(f.temp)).filter(t => !isNaN(t));
                if (extras.mesclador.temp && !isNaN(parseFloat(extras.mesclador.temp))) temps.push(parseFloat(extras.mesclador.temp));
                if (extras.topo.temp && !isNaN(parseFloat(extras.topo.temp))) temps.push(parseFloat(extras.topo.temp));

                const umidades = furos.map(f => parseFloat(f.umidade)).filter(u => !isNaN(u));
                if (extras.mesclador.umidade && !isNaN(parseFloat(extras.mesclador.umidade))) umidades.push(parseFloat(extras.mesclador.umidade));
                if (extras.topo.umidade && !isNaN(parseFloat(extras.topo.umidade))) umidades.push(parseFloat(extras.topo.umidade));

                const avgTemp = temps.length > 0 ? (temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1) : '';
                const avgUmidade = umidades.length > 0 ? (umidades.reduce((a, b) => a + b, 0) / umidades.length).toFixed(1) : '';

                setExtras(prev => ({
                    ...prev,
                    media: { temp: avgTemp, umidade: avgUmidade }
                }));
            }, [furos, extras.mesclador, extras.topo]);

            const handleFuroChange = (index, field, value) => {
                const newFuros = [...furos];
                newFuros[index][field] = value;
                setFuros(newFuros);
            };

            const handleExtraChange = (section, field, value) => {
                setExtras(prev => ({
                    ...prev,
                    [section]: { ...prev[section], [field]: value }
                }));
            };

            const handleSaveColeta = () => {
                const temps = furos.map(f => parseFloat(f.temp)).filter(t => !isNaN(t));
                if (extras.mesclador.temp && !isNaN(parseFloat(extras.mesclador.temp))) temps.push(parseFloat(extras.mesclador.temp));
                if (extras.topo.temp && !isNaN(parseFloat(extras.topo.temp))) temps.push(parseFloat(extras.topo.temp));

                const umidades = furos.map(f => parseFloat(f.umidade)).filter(u => !isNaN(u));
                if (extras.mesclador.umidade && !isNaN(parseFloat(extras.mesclador.umidade))) umidades.push(parseFloat(extras.mesclador.umidade));
                if (extras.topo.umidade && !isNaN(parseFloat(extras.topo.umidade))) umidades.push(parseFloat(extras.topo.umidade));

                // Prioriza a média manual se preenchida, senão calcula dos furos
                let finalTemp = parseFloat(extras.media.temp);
                let finalUmidade = parseFloat(extras.media.umidade);

                if (isNaN(finalTemp) && temps.length > 0) {
                    finalTemp = temps.reduce((a, b) => a + b, 0) / temps.length;
                }

                if (isNaN(finalUmidade) && umidades.length > 0) {
                    finalUmidade = umidades.reduce((a, b) => a + b, 0) / umidades.length;
                }

                onSave({
                    temp: !isNaN(finalTemp) ? finalTemp.toFixed(1) : '',
                    umidade: !isNaN(finalUmidade) ? finalUmidade.toFixed(1) : '',
                    detalhes: { furos, ...extras, data: dataColeta }
                });
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[70] animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-[95%] overflow-hidden border border-slate-200">
                        <div className="bg-slate-800 px-6 py-4 flex justify-between items-center">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                <Icons.Edit /> Nova Coleta (Nº {coletaNumero})
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors">
                                <span className="text-2xl leading-none">&times;</span>
                            </button>
                        </div>

                        <div className="p-6 space-y-6">
                            <div className="overflow-x-auto rounded-lg border border-slate-200 shadow-sm">
                                <table className="w-full text-sm text-center text-slate-600 border-collapse min-w-[1200px]">
                                    <thead className="text-xs text-slate-700 uppercase bg-slate-100">
                                        <tr>
                                            <th rowSpan="2" className="px-4 py-2 border border-slate-300 bg-slate-200 sticky left-0 z-10 shadow-md">Data / Hora</th>
                                            {furos.map((_, i) => (
                                                <th key={i} colSpan="2" className="px-2 py-1 border border-slate-300 bg-slate-100">{i + 1}º Furo</th>
                                            ))}
                                            <th colSpan="2" className="px-2 py-1 border border-slate-300 bg-blue-50">Mesclador</th>
                                            <th colSpan="2" className="px-2 py-1 border border-slate-300 bg-blue-50">Topo</th>
                                            <th colSpan="2" className="px-2 py-1 border border-slate-300 bg-emerald-50">Média</th>
                                            <th rowSpan="2" className="px-4 py-2 border border-slate-300 bg-slate-200">Usuário</th>
                                        </tr>
                                        <tr>
                                            {furos.map((_, i) => (
                                                <React.Fragment key={i}>
                                                    <th className="px-1 py-1 border border-slate-300 text-[10px] w-14">Temp</th>
                                                    <th className="px-1 py-1 border border-slate-300 text-[10px] w-14">Umid</th>
                                                </React.Fragment>
                                            ))}
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-blue-50/50">Temp</th>
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-blue-50/50">Umid</th>
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-blue-50/50">Temp</th>
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-blue-50/50">Umid</th>
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-emerald-50/50">Temp</th>
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-emerald-50/50">Umid</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white">
                                        <tr>
                                            <td className="p-2 border border-slate-300 sticky left-0 bg-white z-10 shadow-md">
                                                <input
                                                    type="datetime-local"
                                                    value={dataColeta}
                                                    onChange={(e) => setDataColeta(e.target.value)}
                                                    className="w-32 text-xs rounded border-gray-300 shadow-sm p-1"
                                                />
                                            </td>
                                            {furos.map((furo, index) => (
                                                <React.Fragment key={furo.id}>
                                                    <td className="p-1 border border-slate-300">
                                                        <input
                                                            type="number"
                                                            step="0.1"
                                                            placeholder="°C"
                                                            value={furo.temp}
                                                            onChange={(e) => handleFuroChange(index, 'temp', e.target.value)}
                                                            className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono"
                                                        />
                                                    </td>
                                                    <td className="p-1 border border-slate-300">
                                                        <input
                                                            type="number"
                                                            step="0.1"
                                                            placeholder="%"
                                                            value={furo.umidade}
                                                            onChange={(e) => handleFuroChange(index, 'umidade', e.target.value)}
                                                            className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono"
                                                        />
                                                    </td>
                                                </React.Fragment>
                                            ))}
                                            {/* Mesclador */}
                                            <td className="p-1 border border-slate-300 bg-blue-50/10"><input type="number" step="0.1" placeholder="°C" value={extras.mesclador.temp} onChange={(e) => handleExtraChange('mesclador', 'temp', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono" /></td>
                                            <td className="p-1 border border-slate-300 bg-blue-50/10"><input type="number" step="0.1" placeholder="%" value={extras.mesclador.umidade} onChange={(e) => handleExtraChange('mesclador', 'umidade', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono" /></td>
                                            {/* Topo */}
                                            <td className="p-1 border border-slate-300 bg-blue-50/10"><input type="number" step="0.1" placeholder="°C" value={extras.topo.temp} onChange={(e) => handleExtraChange('topo', 'temp', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono" /></td>
                                            <td className="p-1 border border-slate-300 bg-blue-50/10"><input type="number" step="0.1" placeholder="%" value={extras.topo.umidade} onChange={(e) => handleExtraChange('topo', 'umidade', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono" /></td>
                                            {/* Média */}
                                            <td className="p-1 border border-slate-300 bg-emerald-50/10"><input type="number" step="0.1" placeholder="°C" value={extras.media.temp} onChange={(e) => handleExtraChange('media', 'temp', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono font-bold text-emerald-600" /></td>
                                            <td className="p-1 border border-slate-300 bg-emerald-50/10"><input type="number" step="0.1" placeholder="%" value={extras.media.umidade} onChange={(e) => handleExtraChange('media', 'umidade', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono font-bold text-emerald-600" /></td>
                                            {/* Usuário */}
                                            <td className="p-1 border border-slate-300"><input type="text" placeholder="Nome" value={extras.usuario} onChange={(e) => setExtras(prev => ({ ...prev, usuario: e.target.value }))} className="w-24 text-center text-xs rounded border-gray-300 p-1" /></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div className="flex justify-end pt-4 gap-3 border-t border-slate-100">
                                <button type="button" onClick={onClose} className="px-6 py-3 text-sm font-bold text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                                    Cancelar
                                </button>
                                <button type="button" onClick={handleSaveColeta} className="px-6 py-3 text-sm font-bold text-white bg-blue-600 rounded-lg hover:bg-blue-500 shadow-lg hover:shadow-blue-500/30 transition-all flex items-center gap-2">
                                    <Icons.Save className="w-4 h-4" /> Confirmar Coleta
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ModalInput = ({ silo, isOpen, onClose, onSave, onSetDrying, onUpdate }) => {
            if (!isOpen || !silo) return null;
            const [formData, setFormData] = useState({ history: [], ...silo });
            const [isColetaModalOpen, setIsColetaModalOpen] = useState(false);

            const hasProduct = formData.cultura && formData.cultura !== 'Vazio';

            useEffect(() => {
                const isEmpty = !silo.cultura || silo.cultura === 'Vazio';
                setFormData({
                    history: [],
                    ...silo,
                    temp: isEmpty ? '' : silo.temp,
                    umidade: isEmpty ? '' : silo.umidade
                });
            }, [silo]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => {
                    const newData = { ...prev, [name]: value };
                    // Se alterar a coleta, limpa temperatura e umidade se ainda forem os valores originais
                    if (name === 'coleta' && value !== (silo.coleta || '')) {
                        if (String(prev.temp) === String(silo.temp)) newData.temp = '';
                        if (String(prev.umidade) === String(silo.umidade)) newData.umidade = '';
                    }
                    return newData;
                });
                setFormData(prev => ({ ...prev, [name]: value }));
            };

                                        <div className="max-h-40 overflow-y-auto custom-scrollbar">
                                            <table className="w-full text-sm text-left">
                                                <thead className="text-xs text-slate-500 bg-slate-50 sticky top-0 shadow-sm">

                    <ColetaDetalhadaModal

        const AcompanhamentoTab = ({ data, onDelete }) => {

                Object.values(data).flat().forEach(silo => {

                // Ordena por data (mais recente primeiro)

            const formatCell = (obj) => {
                if (!obj || (!obj.temp && !obj.umidade)) return '-';
                return `${obj.temp || '-'}°C / ${obj.umidade || '-'}%`;

            return (

                                    const topo = d.topo || {};
                                    const usuario = d.usuario || (d.extras && d.extras.usuario) || '-';

                                    return (
                                        <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                            <td className="px-4 py-3 whitespace-nowrap font-mono text-xs text-slate-500">{item.data ? new Date(item.data).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-'}</td>
                                            <td className="px-4 py-3 whitespace-nowrap font-bold text-slate-700">{item.siloName}</td>
                                            <td className="px-4 py-3 whitespace-nowrap text-center font-bold">#{item.coleta}</td>
                                            <td className="px-4 py-3 whitespace-nowrap text-xs uppercase">{usuario}</td>
                                            <td className="px-4 py-3 whitespace-nowrap text-center font-bold text-emerald-600 bg-emerald-50/30">{item.temp}°C / {item.umidade}%</td>
                                            <td className="px-4 py-3 whitespace-nowrap text-center text-xs font-mono">{formatCell(furos[0])}</td>
                                            <td className="px-4 py-3 whitespace-nowrap text-center text-xs font-mono">{formatCell(furos[1])}</td>
                                            <td className="px-4 py-3 whitespace-nowrap text-center text-xs font-mono">{formatCell(furos[2])}</td>
                                            <td className="px-4 py-3 whitespace-nowrap text-center text-xs font-mono">{formatCell(furos[3])}</td>
                                            <td className="px-4 py-3 whitespace-nowrap text-center text-xs font-mono bg-blue-50/30">{formatCell(mesclador)}</td>
                                            <td className="px-4 py-3 whitespace-nowrap text-center text-xs font-mono bg-blue-50/30">{formatCell(topo)}</td>
                                            <td className="px-4 py-3 whitespace-nowrap text-center">
                                                <button onClick={() => onDelete(item.siloId, item)} className="p-1.5 text-red-500 hover:text-red-700 hover:bg-red-50 rounded-full transition-colors" title="Excluir Registro">
                                                    <Icons.Trash className="w-4 h-4" />
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })}
                                {allHistory.length === 0 && <tr><td colSpan="12" className="px-4 py-8 text-center text-slate-400">Nenhum registro encontrado.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('preSecagem');
            const [selectedSilo, setSelectedSilo] = useState(null);
            const [data, setData] = useState({
                preSecagem: [],
                armazenamento: [],
                metalicos: []
            });
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [weather, setWeather] = useState({ humidity: null, error: null });

            // --- Conexão com API de Clima ---
            useEffect(() => {
                const API_KEY = '9217387cf6c558fdfa1658f058ada093'; // Chave fornecida pelo usuário
                const LAT = -16.9438; // Latitude de Alto Garças, MT
                const LON = -53.5280;  // Longitude de Alto Garças, MT

                const fetchWeather = async () => {
                    if (API_KEY === 'SUA_CHAVE_API_AQUI') {
                        console.warn("API de Clima: Chave não configurada. A umidade do ar não será exibida.");
                        setWeather({ humidity: null, error: 'Chave não configurada' });
                        return;
                    }
                    try {
                        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&appid=${API_KEY}&units=metric&lang=pt_br`);
                        if (!response.ok) {
                            if (response.status === 401) {
                                throw new Error('Chave de API inválida ou inativa.');
                            }
                            throw new Error('Falha ao buscar dados de clima (Cód: ' + response.status + ')');
                        }
                        const data = await response.json();
                        setWeather({ humidity: Math.round(data.main.humidity), error: null });
                    } catch (error) {
                        console.error("Erro ao buscar dados de clima:", error);
                        setWeather({ humidity: null, error: error.message });
                    }
                };

                fetchWeather(); // Busca na carga inicial
                const intervalId = setInterval(fetchWeather, 600000); // Busca a cada 10 minutos

                return () => clearInterval(intervalId); // Limpa o intervalo ao desmontar
            }, []);

            // --- Conexão com Firestore ---
            useEffect(() => {
                const q = query(collection(db, "mes_silos"));

                const unsubscribe = onSnapshot(q, async (snapshot) => {
                    if (snapshot.empty && loading) {
                        setLoading(true); // Garante que o estado de loading seja verdadeiro
                        // Se o banco estiver vazio, popula com dados iniciais (Seed)
                        console.log("Banco vazio. Criando silos iniciais...");
                        const batch = writeBatch(db);
                        SEED_DATA.forEach(silo => {
                            const ref = doc(db, "mes_silos", silo.id);
                            batch.set(ref, silo);
                        });
                        await batch.commit();
                        return; // O snapshot será disparado novamente após o commit
                    }

                    const newData = { preSecagem: [], armazenamento: [], metalicos: [] };

                    snapshot.forEach(doc => {
                        const silo = doc.data();
                        // Categoriza baseado no ID ou Tipo
                        if (silo.id.startsWith('PS')) newData.preSecagem.push(silo);
                        else if (silo.id.startsWith('AZ')) newData.armazenamento.push(silo);
                        else if (silo.id.startsWith('MT')) newData.metalicos.push(silo);
                    });

                    // Ordenar por ID numérico simples
                    const sortFn = (a, b) => {
                        const numA = parseInt(a.id.split('-')[1]);
                        const numB = parseInt(b.id.split('-')[1]);
                        return numA - numB;
                    };

                    newData.preSecagem.sort(sortFn);
                    newData.armazenamento.sort(sortFn);
                    newData.metalicos.sort(sortFn);

                    setData(newData);
                    setLoading(false);
                    setError(null); // Limpa erros anteriores em caso de sucesso
                }, (err) => {
                    console.error("Erro no listener do Firestore:", err);
                    setError("Permissão negada. Verifique se você está logado e se as regras de segurança estão corretas.");
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            const handleUpdateSilo = async (category, updatedSilo) => {
                // Atualiza diretamente no Firestore. O listener acima atualizará a UI.
                try {
                    await setDoc(doc(db, "mes_silos", updatedSilo.id), updatedSilo);
                } catch (error) {
                    console.error("Erro ao atualizar silo:", error);
                    alert("Erro ao salvar dados no servidor.");
                }
            };

            const handleSetDrying = async (siloToUpdate) => {
                try {
                    // Usamos merge: true para apenas atualizar o campo 'status', sem sobrescrever o resto.
                    await setDoc(doc(db, "mes_silos", siloToUpdate.id), {
                        status: 'drying'
                    }, { merge: true });
                } catch (error) {
                    console.error("Erro ao definir status para secando:", error);
                    alert("Erro ao atualizar status do silo.");
                }
            };

            const handleDeleteHistory = async (siloId, historyItem) => {
                if (!window.confirm(`Deseja excluir o registro de coleta #${historyItem.coleta} do ${historyItem.siloName}?`)) return;

                let targetSilo = null;
                // Procura em todas as categorias
                for (const cat in data) {
                    const found = data[cat].find(s => s.id === siloId);
                    if (found) {
                        targetSilo = found;
                        break;
                    }
                }

                if (!targetSilo) return;

                const newHistory = (targetSilo.history || []).filter(h => h.timestamp !== historyItem.timestamp);

                try {
                    await setDoc(doc(db, "mes_silos", siloId), { ...targetSilo, history: newHistory });
                } catch (error) {
                    console.error("Erro ao excluir histórico:", error);
                    alert("Erro ao excluir registro.");
                }
            };

            const tabs = [
                { id: 'preSecagem', label: 'Pré-Secagem (10)' },
                { id: 'armazenamento', label: 'Armazenamento (20)' },
                { id: 'metalicos', label: 'Metálicos (10)' },
                { id: 'acompanhamento', label: 'Acompanhamento' }
            ];

            if (error) {
                return <div className="text-center py-20 text-red-600 font-bold animate-fade-in">{error}</div>;

                                </a>

                                    <span className="text-blue-400">MES</span> Operacional
                                </h1>
                            </div>
                            <span className="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">Terminal: OPER-01</span>
                        </div>
                    </header>

                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800">Entrada de Dados</h2>
                                <p className="text-slate-500 text-sm">Selecione o silo para atualizar as leituras.</p>
                            </div>

                            <div className="flex bg-white rounded-lg p-1 shadow-sm border border-slate-200">

                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab === tab.id
                                            ? 'bg-blue-600 text-white shadow'
                                            : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                                            }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {activeTab === 'acompanhamento' ? (
                            <AcompanhamentoTab data={data} onDelete={handleDeleteHistory} />
                        ) : loading ? (
                            <div className="text-center py-20 text-slate-500">Carregando dados dos silos...</div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-4 animate-fade-in">
                                {data[activeTab].map(silo => (
                                    <SiloCard
                                        key={silo.id}
                                        silo={silo}
                                        airHumidity={weather.humidity}
                                        airHumidityError={weather.error}
                                        onSetDrying={handleSetDrying}
                                        onClick={setSelectedSilo}
                                    />
                                ))}
                            </div>
                        )}
                    </main>

                    <ModalInput
                        isOpen={!!selectedSilo}
                        silo={selectedSilo}
                        onClose={() => setSelectedSilo(null)}
                        onSave={(updatedSilo) => {
                            handleUpdateSilo(activeTab, updatedSilo);

                        }}
                        onSetDrying={handleSetDrying}
                        onUpdate={(updatedSilo) => handleUpdateSilo(activeTab, updatedSilo)}

                </div>
            );

        // --- Componente de Autenticação ---
        const AuthWrapper = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    setUser(user);
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (authLoading) {
                return <div className="text-center py-40 text-slate-500 font-semibold">Verificando autenticação...</div>;
            }

            if (!user) {
                return (
                    <div className="text-center py-40 text-red-600 font-bold">
                        <p>Acesso Negado. Você precisa estar logado para ver esta página.</p>
                        <a href="index.html" className="mt-4 inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Ir para a página de Login</a>
                    </div>
                );
            }

            return <App />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthWrapper />);
    </script>
</body>

</html>
