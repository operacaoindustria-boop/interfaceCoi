<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Agro - Interface Operacional</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, writeBatch, query, getDocs, getDoc, addDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyB_ZscXHOoNP1Xkm-C6WLqhwEFcTsBk3GQ",
            authDomain: "integracaocoi.firebaseapp.com",
            projectId: "integracaocoi",
            storageBucket: "integracaocoi.firebasestorage.app",
            messagingSenderId: "177203745489",
            appId: "1:177203745489:web:b86bbc4e96830e06032bf0"
        };

        // --- Inicialização Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect } = React;

        // --- Configuração Inicial e Utilitários ---

        const generateSilos = (count, prefix, type) => {
            return Array.from({ length: count }, (_, i) => ({
                id: `${prefix}-${i + 1}`,
                name: `${type} ${i + 1}`,
                type: type,
                temp: (20 + Math.random() * 10).toFixed(1),
                umidade: (12 + Math.random() * 4).toFixed(1),
                cultura: 'Vazio',
                cultivar: '',
                pesoCargaKg: 0,
                coleta: '',
                lastUpdate: new Date().toLocaleTimeString(),
                status: 'normal'
            }));
        };

        // Dados iniciais apenas para popular o banco na primeira execução
        const SEED_DATA = [
            ...generateSilos(10, 'PS', 'Pré-Secagem'),
            ...generateSilos(20, 'AZ', 'Armazenamento'),
            ...generateSilos(10, 'MT', 'Metálico')
        ];

        // --- Ícones ---
        const Icons = {
            Thermometer: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" /><path d="M15 2h-6" /></svg>,
            Droplet: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-6-9-7-9S5 8 5 15a7 7 0 0 0 7 7Z" /><path d="m9 12 2 2 4-4" /></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" /></svg>,
            Save: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></svg>,
            ArrowLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>,
            Scale: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="M7 21h10" /><path d="M12 3v18" /><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></svg>,
            Wind: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2" /><path d="M9.6 4.6A2 2 0 1 1 11 8H2" /><path d="M12.6 19.4A2 2 0 1 0 14 16H2" /></svg>,
            Fire: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" /></svg>,
            Transfer: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 20V10a3 3 0 0 1 6 0v10" /><path d="M3 10a3 3 0 0 1 6 0" /><path d="M3 20h6" /><path d="M15 20V10a3 3 0 0 1 6 0v10" /><path d="M15 10a3 3 0 0 1 6 0" /><path d="M15 20h6" /><path d="M9 14h6" /><path d="m12 11 3 3-3 3" /></svg>,
            Cooling: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="2" y1="12" x2="22" y2="12" /><line x1="12" y1="2" x2="12" y2="22" /><path d="m20 16-4-4 4-4" /><path d="m4 8 4 4-4 4" /><path d="m16 4-4 4-4-4" /><path d="m8 20 4-4 4 4" /></svg>,
            Discharge: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M6 20V10a6 6 0 1 1 12 0v10" /><path d="M6 10a6 6 0 0 1 12 0" /><path d="M6 20h12" /><path d="M12 20v-4" /><path d="m10 18 2 2 2-2" /></svg>,
            Trash: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>,
            History: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" /></svg>,
            ClipboardList: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="M12 11h4" /><path d="M12 16h4" /><path d="M8 11h.01" /><path d="M8 16h.01" /></svg>,
            Database: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /></svg>,
        };

        // --- Componentes ---
        const MarcoldSelectionModal = ({ isOpen, onClose, onSelect }) => {
            if (!isOpen) return null;

            const marcolds = Array.from({ length: 12 }, (_, i) => `MARCOLD ${String(i + 1).padStart(2, '0')}`);

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[90] animate-fade-in" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200" onClick={e => e.stopPropagation()}>
                        <div className="bg-cyan-600 px-6 py-4 flex justify-between items-center">
                            <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                <Icons.Cooling className="w-5 h-5" /> Selecionar Unidade de Frio
                            </h3>
                            <button onClick={onClose} className="text-cyan-100 hover:text-white transition-colors text-2xl leading-none">&times;</button>
                        </div>
                        <div className="p-6 grid grid-cols-2 gap-3 max-h-[60vh] overflow-y-auto">
                            {marcolds.map(m => (
                                <button
                                    key={m}
                                    onClick={() => onSelect(m)}
                                    className="p-3 rounded-lg border border-slate-200 hover:border-cyan-500 hover:bg-cyan-50 text-slate-700 font-bold text-sm transition-all"
                                >
                                    {m}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const DischargeSelectionModal = ({ isOpen, onClose, onSelect }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[90] animate-fade-in" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden border border-slate-200" onClick={e => e.stopPropagation()}>
                        <div className="bg-purple-600 px-6 py-4 flex justify-between items-center">
                            <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                <Icons.Discharge className="w-5 h-5" /> Selecionar Destino
                            </h3>
                            <button onClick={onClose} className="text-purple-200 hover:text-white transition-colors text-2xl leading-none">&times;</button>
                        </div>
                        <div className="p-6 grid gap-3">
                            <button onClick={() => onSelect('Secadores')} className="p-4 rounded-lg border border-slate-200 hover:border-purple-500 hover:bg-purple-50 text-slate-700 font-bold text-lg transition-all flex items-center justify-center gap-2">
                                <Icons.Wind className="w-6 h-6 text-purple-600" /> Secadores
                            </button>
                            <button onClick={() => onSelect('Silo Pulmão')} className="p-4 rounded-lg border border-slate-200 hover:border-purple-500 hover:bg-purple-50 text-slate-700 font-bold text-lg transition-all flex items-center justify-center gap-2">
                                <Icons.Database className="w-6 h-6 text-purple-600" /> Silo Pulmão
                            </button>
                            <button onClick={() => onSelect('Transbordo')} className="p-4 rounded-lg border border-slate-200 hover:border-purple-500 hover:bg-purple-50 text-slate-700 font-bold text-lg transition-all flex items-center justify-center gap-2">
                                <Icons.Transfer className="w-6 h-6 text-purple-600" /> Transbordo
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const SiloCard = ({ silo, onClick, airHumidity, airHumidityError, onSetStatus, onOpenMarcoldModal, onStartTranshipment, onStartDischarge }) => {
            const getStatusColor = () => {
                const temp = parseFloat(silo.temp || 0);
                const umid = parseFloat(silo.umidade || 0);
                const hasProduct = silo.cultura && silo.cultura !== 'Vazio';

                if (!hasProduct) return 'bg-white border-slate-200 text-slate-400';

                if (silo.status === 'drying') return 'bg-orange-50 border-orange-500 text-orange-900';
                if (silo.status === 'cooling') return 'bg-cyan-50 border-cyan-500 text-cyan-900';
                if (silo.status === 'maintenance') return 'bg-red-50 border-red-500 text-red-900';

                if (silo.status === 'critical' || temp > 35 || umid > 16) return 'bg-red-50 border-red-500 text-red-900';
                if (silo.status === 'warning' || temp > 30 || umid > 14) return 'bg-yellow-50 border-yellow-500 text-yellow-900';

                return 'bg-emerald-50 border-emerald-500 text-emerald-900';
            };

            // Recupera o peso considerando possíveis variações de nome de campo vindos da Moega (peso, pesoLiquido)
            const peso = parseFloat(silo.pesoCargaKg || silo.peso || silo.pesoLiquido || 0);
            const tonnage = peso ? (peso / 1000).toFixed(2) : '0.00';
            const hasProduct = silo.cultura && silo.cultura !== 'Vazio';
            const displayAirHumidity = airHumidityError ? '--' : (airHumidity ?? '--');
            const humidityTitle = airHumidityError ? `Erro API: ${airHumidityError}` : "Umidade Relativa do Ar";
            const displayUmidade = hasProduct ? silo.umidade : '0.0';
            const displayTemp = hasProduct ? silo.temp : '0.0';

            const handleDryingClick = (e) => {
                e.stopPropagation(); // Impede que o modal de edição abra
                const newStatus = silo.status === 'drying' ? 'normal' : 'drying';
                onSetStatus(silo, newStatus);
            };

            const handleCoolingClick = (e) => {
                e.stopPropagation();
                if (silo.status === 'cooling') {
                    onSetStatus(silo, 'normal');
                } else {
                    onOpenMarcoldModal(silo);
                }
            };

            return (
                <div
                    onClick={() => onClick(silo)}
                    className={`p-6 rounded-xl border-l-8 shadow-md cursor-pointer hover:shadow-xl hover:scale-[1.01] transition-all ${getStatusColor()}`}
                >
                    <div className="flex justify-between items-center mb-3">
                        <span className="font-bold text-2xl whitespace-nowrap overflow-hidden text-ellipsis">{silo.name}</span>
                        <div className="flex items-center gap-1">
                            <button onClick={handleDryingClick} title="Secagem" className={`p-1.5 rounded-full transition-colors ${silo.status === 'drying' ? 'bg-orange-100 text-orange-600' : 'text-slate-400 hover:text-orange-500 hover:bg-orange-50'}`}>
                                <Icons.Fire className="w-4 h-4" />
                            </button>
                            <button onClick={handleCoolingClick} title="Refrigeração" className={`p-1.5 rounded-full transition-colors ${silo.status === 'cooling' ? 'bg-cyan-100 text-cyan-600' : 'text-slate-400 hover:text-cyan-500 hover:bg-cyan-50'}`}>
                                <Icons.Cooling className="w-4 h-4" />
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); onStartTranshipment(silo); }} title="Transilagem" className="p-1.5 rounded-full text-slate-400 hover:text-blue-500 hover:bg-blue-50 transition-colors">
                                <Icons.Transfer className="w-4 h-4" />
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); onStartDischarge(silo); }} title="Descarga" className="p-1.5 rounded-full text-slate-400 hover:text-purple-500 hover:bg-purple-50 transition-colors">
                                <Icons.Discharge className="w-4 h-4" />
                            </button>
                            <span className={`text-sm px-3 py-1 rounded font-bold border whitespace-nowrap ${!hasProduct ? 'bg-slate-100 text-slate-500 border-slate-300' : 'bg-white/60 border-black/10'}`}>
                                {silo.cultura || 'Vazio'}
                            </span>
                        </div>
                    </div>

                    {hasProduct && silo.cultivar && (
                        <div className="mb-4 text-sm font-bold opacity-80 bg-black/5 px-3 py-1.5 rounded-md inline-block whitespace-nowrap max-w-full overflow-hidden text-ellipsis">
                            {silo.cultivar}
                        </div>
                    )}

                    <div className="grid grid-cols-2 gap-x-4 gap-y-3 text-base font-bold mt-2">
                        <div className="flex items-center gap-2 whitespace-nowrap" title={humidityTitle}><Icons.Wind className="w-5 h-5" /> {displayAirHumidity}%</div>
                        <div className="flex items-center gap-2 whitespace-nowrap"><Icons.Thermometer className="w-5 h-5" /> {displayTemp}°C</div>
                        <div className="flex items-center gap-2 whitespace-nowrap"><Icons.Droplet className="w-5 h-5" /> {displayUmidade}%</div>
                        <div className="flex items-center gap-2 whitespace-nowrap" title="Peso da última carga"><Icons.Scale className="w-5 h-5" /> {tonnage} t</div>
                    </div>

                    {silo.status === 'cooling' && silo.marcold && (
                        <div className="mt-3 bg-cyan-50 border border-cyan-200 rounded-lg p-2 flex items-center justify-center gap-2 text-cyan-800 font-bold text-sm animate-fade-in">
                            <Icons.Cooling className="w-4 h-4" /> {silo.marcold}
                        </div>
                    )}

                    <div className="mt-3 text-[10px] uppercase tracking-wide opacity-70">
                        Atualizado: {silo.lastUpdate}
                    </div>
                </div>
            );
        };

        const AcompanhamentoTab = ({ data, onDelete }) => {
            const [selectedSilo, setSelectedSilo] = useState(null);

            const silosWithHistory = React.useMemo(() => {
                const list = [];
                Object.values(data).flat().forEach(silo => {
                    if (silo.history && Array.isArray(silo.history) && silo.history.length > 0) {
                        list.push(silo);
                    }
                });
                return list;
            }, [data]);

            const formatCell = (obj) => {
                if (!obj || (!obj.temp && !obj.umidade)) return '-';
                return `${obj.temp || '-'}°C / ${obj.umidade || '-'}%`;
            };

            return (
                <div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 animate-fade-in">
                        {silosWithHistory.map(silo => {
                            const lastHistory = silo.history[0];
                            return (
                                <div key={silo.id} onClick={() => setSelectedSilo(silo)} className="bg-white p-4 rounded-lg shadow border border-slate-200 cursor-pointer hover:shadow-md transition-all group">
                                    <div className="flex justify-between items-start mb-2">
                                        <h3 className="font-bold text-lg text-slate-700 group-hover:text-blue-600 transition-colors">{silo.name}</h3>
                                        <span className="text-xs font-bold bg-blue-100 text-blue-700 px-2 py-1 rounded-full">{silo.history.length} Coletas</span>
                                    </div>
                                    <div className="text-sm text-slate-500 mb-3 flex items-center gap-1">
                                        <Icons.History className="w-3 h-3" />
                                        Última: {lastHistory.data ? new Date(lastHistory.data).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'N/A'}
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="flex-1 bg-slate-50 p-2 rounded border border-slate-100 text-center">
                                            <div className="text-[10px] text-slate-400 uppercase font-bold">Temp</div>
                                            <div className="font-mono font-bold text-slate-700">{lastHistory.temp}°C</div>
                                        </div>
                                        <div className="flex-1 bg-slate-50 p-2 rounded border border-slate-100 text-center">
                                            <div className="text-[10px] text-slate-400 uppercase font-bold">Umid</div>
                                            <div className="font-mono font-bold text-slate-700">{lastHistory.umidade}%</div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        {silosWithHistory.length === 0 && (
                            <div className="col-span-full text-center py-10 text-slate-500 bg-white rounded-lg border border-slate-200 border-dashed">
                                Nenhum histórico de coleta encontrado.
                            </div>
                        )}
                    </div>

                    {selectedSilo && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[80] animate-fade-in">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-[95%] h-[90vh] flex flex-col overflow-hidden border border-slate-200">
                                <div className="bg-slate-800 px-6 py-4 flex justify-between items-center shrink-0">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                        <Icons.History /> Histórico: {selectedSilo.name}
                                    </h3>
                                    <button onClick={() => setSelectedSilo(null)} className="text-slate-400 hover:text-white transition-colors">
                                        <span className="text-2xl leading-none">&times;</span>
                                    </button>
                                </div>
                                <div className="flex-1 overflow-auto p-6 bg-slate-50">
                                    <div className="bg-white rounded-lg shadow border border-slate-200 overflow-hidden">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left text-slate-600">
                                                <thead className="text-xs text-slate-700 uppercase bg-slate-100 border-b border-slate-200">
                                                    <tr>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap">Data/Hora</th>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap text-center">Coleta</th>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap">Usuário</th>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap text-center bg-emerald-50 text-emerald-800">Média (T/U)</th>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap text-center">Furo 1</th>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap text-center">Furo 2</th>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap text-center">Furo 3</th>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap text-center">Furo 4</th>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap text-center bg-blue-50 text-blue-800">Mesclador</th>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap text-center bg-blue-50 text-blue-800">Topo</th>
                                                        <th className="px-4 py-3 font-bold whitespace-nowrap text-center text-red-600">Ação</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {selectedSilo.history.map((item, idx) => {
                                                        const d = item.detalhes || {};
                                                        const furos = d.furos || [];
                                                        const mesclador = d.mesclador || {};
                                                        const topo = d.topo || {};

                                                                <td className="px-4 py-3 whitespace-nowrap text-center text-xs font-mono">{formatCell(furos[1])}</td>
                                                                <td className="px-4 py-3 whitespace-nowrap text-center text-xs font-mono">{formatCell(furos[2])}</td>

            );
        };

        const RastreabilidadeModal = ({ silo, onClose, allSilos }) => {
            if (!silo) return null;

            const [selectedCargaIndex, setSelectedCargaIndex] = useState(0);

            // Recuperar histórico de cargas - combina cargas históricas e a carga atual
            const cargas = React.useMemo(() => {
                const cargasList = [];

                // Se houver cargas no histórico, adiciona
                if (silo.cargas && Array.isArray(silo.cargas)) {
                    cargasList.push(...silo.cargas);
                }

                // Se houver dados da carga atual no silo, cria um objeto de carga
                if (silo.cultura && silo.cultura !== 'Vazio' && silo.pesoCargaKg > 0) {
                    const cargaAtual = {
                        cultura: silo.cultura,
                        cultivar: silo.cultivar,
                        moegaOrigem: silo.moegaOrigem,
                        fazenda: silo.fazenda,
                        zona: silo.zona,
                        talhao: silo.talhao,
                        impureza: silo.impureza,
                        pesoCargaKg: silo.pesoCargaKg || silo.peso || silo.pesoLiquido || 0,
                        origemCarga: silo.origemCarga,
                        placaOrigem: silo.placaOrigem,
                        origemTransilagem: silo.origemTransilagem,
                        umidadeChegada: silo.umidadeChegada
                    };

                    // Verifica se não é duplicata
                    const isDuplicate = cargasList.some(c =>
                        c.pesoCargaKg === cargaAtual.pesoCargaKg &&
                        c.moegaOrigem === cargaAtual.moegaOrigem
                    );

                    if (!isDuplicate && cargasList.length === 0) {
                        cargasList.push(cargaAtual);
                    }
                }

                return cargasList;
            }, [silo]);

            const currentCarga = cargas[selectedCargaIndex] || {};
            const peso = parseFloat(currentCarga.pesoCargaKg || currentCarga.peso || currentCarga.pesoLiquido || 0);
            const tonnage = peso ? (peso / 1000).toFixed(2) : '0.00';

            let transhipmentOriginName = null;
            if (currentCarga.origemTransilagem) {
                if (allSilos) {
                    const flatSilos = Object.values(allSilos).flat();
                    const found = flatSilos.find(s => s.id === currentCarga.origemTransilagem);
                    transhipmentOriginName = found ? found.name : currentCarga.origemTransilagem;
                } else {
                    transhipmentOriginName = currentCarga.origemTransilagem;
                }
            }

            const fields = [
                { label: 'Silo', value: silo.name || 'N/A', highlight: false },
                { label: 'Nº de Cargas', value: cargas.length, highlight: false },
                { label: 'Cultura', value: currentCarga.cultura || silo.cultura || 'N/A', highlight: true },
                ...(transhipmentOriginName ? [
                    { label: 'Operação', value: 'TRANSILAGEM', highlight: true, isTranshipment: true },
                    { label: 'Origem Transilagem', value: transhipmentOriginName, highlight: true, isTranshipment: true }
                ] : []),
                { label: 'Cultivar', value: currentCarga.cultivar || silo.cultivar || 'N/A', highlight: false },
                { label: 'Moega de Origem', value: currentCarga.moegaOrigem ? `Moega ${String(currentCarga.moegaOrigem).padStart(2, '0')}` : 'N/A', highlight: false },
                { label: 'Umidade Chegada', value: currentCarga.umidadeChegada ? `${currentCarga.umidadeChegada}%` : 'N/A', highlight: false },
                { label: 'Fazenda', value: currentCarga.fazenda || silo.fazenda || 'N/A', highlight: false },
                { label: 'Zona', value: currentCarga.zona || silo.zona || 'N/A', highlight: false },
                { label: 'Talhão', value: currentCarga.talhao || silo.talhao || 'N/A', highlight: false },
                { label: 'Impureza', value: currentCarga.impureza ? `${currentCarga.impureza}%` : 'N/A', highlight: false },
                { label: 'Peso da Carga', value: `${tonnage} t`, highlight: false },
                { label: 'Romaneio Origem', value: currentCarga.origemCarga || silo.origemCarga || 'N/A', highlight: false },
                { label: 'Placa Origem', value: currentCarga.placaOrigem || silo.placaOrigem || 'N/A', highlight: false },
            ];

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[80] animate-fade-in" onClick={onClose}>

                            <button onClick={onClose} className="text-blue-200 hover:text-white transition-colors text-3xl leading-none">&times;</button>
                        </div>

                        {cargas.length > 0 && (
                            <div className="bg-slate-100 px-6 py-3 border-b border-slate-200 flex items-center gap-2 overflow-x-auto">
                                {cargas.map((carga, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => setSelectedCargaIndex(idx)}
                                        className={`px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap transition-all ${selectedCargaIndex === idx
                                            ? 'bg-blue-600 text-white shadow-md'
                                            : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50'
                                            }`}
                                    >
                                        Carga {idx + 1}
                                    </button>
                                ))}
                            </div>
                        )}

                        <div className="p-6 space-y-3 max-h-[70vh] overflow-y-auto">
                            <div className="grid grid-cols-2 gap-4">
                                {fields.map(field => (
                                    <div
                                        key={field.label}
                                        className={`p-3 rounded-lg border ${
                                            field.isTranshipment ? 'bg-purple-50 border-purple-200' :
                                            field.highlight ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'
                                            } hover:shadow-md transition-shadow`}
                                    >
                                        <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">
                                            {field.label}
                                        </div>
                                        <div className={`text-sm font-bold ${
                                            field.isTranshipment ? 'text-purple-700' :
                                            field.highlight ? 'text-emerald-700' : 'text-slate-700'
                                            }`}>
                                            {field.value}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="bg-slate-50 px-6 py-3 border-t border-slate-200 flex justify-end">
                            <button
                                onClick={onClose}
                                className="px-4 py-2 text-sm font-bold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-100 transition-colors"
                            >
                                Fechar
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const RastreabilidadeTab = ({ data }) => {
            const [selectedSilo, setSelectedSilo] = useState(null);

            const silosComProduto = React.useMemo(() => {
                return Object.values(data).flat().filter(s => s.cultura && s.cultura !== 'Vazio');
            }, [data]);

            const handleCardClick = (e, silo) => {
                e.preventDefault();
                e.stopPropagation();
                setSelectedSilo(silo);
            };

            return (
                <div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 animate-fade-in">
                        {silosComProduto.map(silo => {
                            const peso = parseFloat(silo.pesoCargaKg || silo.peso || silo.pesoLiquido || 0);
                            const tonnage = peso ? (peso / 1000).toFixed(2) : '0.00';
                            return (
                                <div key={silo.id} onClick={(e) => handleCardClick(e, silo)} className="bg-white p-5 rounded-xl shadow-md border-l-4 border-blue-500 cursor-pointer hover:shadow-lg hover:border-blue-600 transition-all group">
                                    <div className="flex justify-between items-start mb-2">
                                        <h3 className="font-bold text-xl text-slate-800 group-hover:text-blue-600">{silo.name}</h3>
                                        <span className="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-1 rounded-full border border-blue-200">{silo.cultura}</span>
                                    </div>
                                    <p className="text-sm text-slate-500 mb-4 truncate" title={silo.cultivar}>{silo.cultivar || 'Cultivar não informado'}</p>
                                    <div className="flex justify-between items-end pt-3 border-t border-slate-100">
                                        <div className="text-left"><div className="text-xs text-slate-400 uppercase font-bold">Peso Total</div><div className="font-mono font-bold text-slate-700 text-lg">{tonnage} t</div></div>
                                        <div className="text-right"><div className="text-xs text-slate-400 uppercase font-bold">Origem</div><div className="font-mono font-bold text-slate-700">{silo.moegaOrigem ? `Moega ${String(silo.moegaOrigem).padStart(2, '0')}` : '-'}</div></div>
                                    </div>
                                </div>
                            );
                        })}
                        {silosComProduto.length === 0 && (<div className="col-span-full text-center py-16 text-slate-500 bg-white rounded-lg border border-slate-200 border-dashed">Nenhum silo com produto para rastrear.</div>)}
                    </div>
                    {selectedSilo && <RastreabilidadeModal silo={selectedSilo} allSilos={data} onClose={() => setSelectedSilo(null)} />}
                </div>
            );
        };

        const ColetaDetalhadaModal = ({ isOpen, onClose, onSave, coletaNumero }) => {
            if (!isOpen) return null;

            const [furos, setFuros] = useState([
                { id: 1, temp: '', umidade: '' },
                { id: 2, temp: '', umidade: '' },
                { id: 3, temp: '', umidade: '' },
                { id: 4, temp: '', umidade: '' },
            ]);
            const [dataColeta, setDataColeta] = useState(() => new Date().toISOString().slice(0, 16));
            const [extras, setExtras] = useState({
                mesclador: { temp: '', umidade: '' },
                topo: { temp: '', umidade: '' },
                media: { temp: '', umidade: '' },
                usuario: ''
            });

            // Cálculo automático da média sempre que os dados dos furos mudarem
            useEffect(() => {
                const temps = furos.map(f => parseFloat(f.temp)).filter(t => !isNaN(t));
                if (extras.mesclador.temp && !isNaN(parseFloat(extras.mesclador.temp))) temps.push(parseFloat(extras.mesclador.temp));
                if (extras.topo.temp && !isNaN(parseFloat(extras.topo.temp))) temps.push(parseFloat(extras.topo.temp));

                const umidades = furos.map(f => parseFloat(f.umidade)).filter(u => !isNaN(u));
                if (extras.mesclador.umidade && !isNaN(parseFloat(extras.mesclador.umidade))) umidades.push(parseFloat(extras.mesclador.umidade));
                if (extras.topo.umidade && !isNaN(parseFloat(extras.topo.umidade))) umidades.push(parseFloat(extras.topo.umidade));

                const avgTemp = temps.length > 0 ? (temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1) : '';
                const avgUmidade = umidades.length > 0 ? (umidades.reduce((a, b) => a + b, 0) / umidades.length).toFixed(1) : '';

                setExtras(prev => ({
                    ...prev,
                    media: { temp: avgTemp, umidade: avgUmidade }
                }));
            }, [furos, extras.mesclador, extras.topo]);

            const handleFuroChange = (index, field, value) => {
                const newFuros = [...furos];
                newFuros[index][field] = value;
                setFuros(newFuros);
            };

            const handleExtraChange = (section, field, value) => {
                setExtras(prev => ({
                    ...prev,
                    [section]: { ...prev[section], [field]: value }
                }));
            };

            const handleSaveColeta = () => {
                const temps = furos.map(f => parseFloat(f.temp)).filter(t => !isNaN(t));
                if (extras.mesclador.temp && !isNaN(parseFloat(extras.mesclador.temp))) temps.push(parseFloat(extras.mesclador.temp));
                if (extras.topo.temp && !isNaN(parseFloat(extras.topo.temp))) temps.push(parseFloat(extras.topo.temp));

                const umidades = furos.map(f => parseFloat(f.umidade)).filter(u => !isNaN(u));
                if (extras.mesclador.umidade && !isNaN(parseFloat(extras.mesclador.umidade))) umidades.push(parseFloat(extras.mesclador.umidade));
                if (extras.topo.umidade && !isNaN(parseFloat(extras.topo.umidade))) umidades.push(parseFloat(extras.topo.umidade));

                // Prioriza a média manual se preenchida, senão calcula dos furos
                let finalTemp = parseFloat(extras.media.temp);
                let finalUmidade = parseFloat(extras.media.umidade);

                if (isNaN(finalTemp) && temps.length > 0) {
                    finalTemp = temps.reduce((a, b) => a + b, 0) / temps.length;
                }

                if (isNaN(finalUmidade) && umidades.length > 0) {
                    finalUmidade = umidades.reduce((a, b) => a + b, 0) / umidades.length;
                }

                onSave({
                    temp: !isNaN(finalTemp) ? finalTemp.toFixed(1) : '',
                    umidade: !isNaN(finalUmidade) ? finalUmidade.toFixed(1) : '',
                    detalhes: { furos, ...extras, data: dataColeta }
                });
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[70] animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-[95%] overflow-hidden border border-slate-200">
                        <div className="bg-slate-800 px-6 py-4 flex justify-between items-center">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                <Icons.Edit /> Nova Coleta (Nº {coletaNumero})
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors">
                                <span className="text-2xl leading-none">&times;</span>
                            </button>
                        </div>

                        <div className="p-6 space-y-6">
                            <div className="overflow-x-auto rounded-lg border border-slate-200 shadow-sm">
                                <table className="w-full text-sm text-center text-slate-600 border-collapse min-w-[1200px]">
                                    <thead className="text-xs text-slate-700 uppercase bg-slate-100">
                                        <tr>
                                            <th rowSpan="2" className="px-4 py-2 border border-slate-300 bg-slate-200 sticky left-0 z-10 shadow-md">Data / Hora</th>
                                            {furos.map((_, i) => (
                                                <th key={i} colSpan="2" className="px-2 py-1 border border-slate-300 bg-slate-100">{i + 1}º Furo</th>
                                            ))}
                                            <th colSpan="2" className="px-2 py-1 border border-slate-300 bg-blue-50">Mesclador</th>
                                            <th colSpan="2" className="px-2 py-1 border border-slate-300 bg-blue-50">Topo</th>
                                            <th colSpan="2" className="px-2 py-1 border border-slate-300 bg-emerald-50">Média</th>
                                            <th rowSpan="2" className="px-4 py-2 border border-slate-300 bg-slate-200">Usuário</th>
                                        </tr>
                                        <tr>
                                            {furos.map((_, i) => (
                                                <React.Fragment key={i}>
                                                    <th className="px-1 py-1 border border-slate-300 text-[10px] w-14">Temp</th>
                                                    <th className="px-1 py-1 border border-slate-300 text-[10px] w-14">Umid</th>
                                                </React.Fragment>
                                            ))}
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-blue-50/50">Temp</th>
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-blue-50/50">Umid</th>
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-blue-50/50">Temp</th>
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-blue-50/50">Umid</th>
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-emerald-50/50">Temp</th>
                                            <th className="px-1 py-1 border border-slate-300 text-[10px] w-14 bg-emerald-50/50">Umid</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white">
                                        <tr>
                                            <td className="p-2 border border-slate-300 sticky left-0 bg-white z-10 shadow-md">
                                                <input
                                                    type="datetime-local"
                                                    value={dataColeta}
                                                    onChange={(e) => setDataColeta(e.target.value)}
                                                    className="w-32 text-xs rounded border-gray-300 shadow-sm p-1"
                                                />
                                            </td>
                                            {furos.map((furo, index) => (
                                                <React.Fragment key={furo.id}>
                                                    <td className="p-1 border border-slate-300">
                                                        <input
                                                            type="number"
                                                            step="0.1"
                                                            placeholder="°C"
                                                            value={furo.temp}
                                                            onChange={(e) => handleFuroChange(index, 'temp', e.target.value)}
                                                            className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono"
                                                        />
                                                    </td>
                                                    <td className="p-1 border border-slate-300">
                                                        <input
                                                            type="number"
                                                            step="0.1"
                                                            placeholder="%"
                                                            value={furo.umidade}
                                                            onChange={(e) => handleFuroChange(index, 'umidade', e.target.value)}
                                                            className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono"
                                                        />
                                                    </td>
                                                </React.Fragment>
                                            ))}
                                            {/* Mesclador */}
                                            <td className="p-1 border border-slate-300 bg-blue-50/10"><input type="number" step="0.1" placeholder="°C" value={extras.mesclador.temp} onChange={(e) => handleExtraChange('mesclador', 'temp', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono" /></td>
                                            <td className="p-1 border border-slate-300 bg-blue-50/10"><input type="number" step="0.1" placeholder="%" value={extras.mesclador.umidade} onChange={(e) => handleExtraChange('mesclador', 'umidade', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono" /></td>
                                            {/* Topo */}
                                            <td className="p-1 border border-slate-300 bg-blue-50/10"><input type="number" step="0.1" placeholder="°C" value={extras.topo.temp} onChange={(e) => handleExtraChange('topo', 'temp', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono" /></td>
                                            <td className="p-1 border border-slate-300 bg-blue-50/10"><input type="number" step="0.1" placeholder="%" value={extras.topo.umidade} onChange={(e) => handleExtraChange('topo', 'umidade', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono" /></td>
                                            {/* Média */}
                                            <td className="p-1 border border-slate-300 bg-emerald-50/10"><input type="number" step="0.1" placeholder="°C" value={extras.media.temp} onChange={(e) => handleExtraChange('media', 'temp', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono font-bold text-emerald-600" /></td>
                                            <td className="p-1 border border-slate-300 bg-emerald-50/10"><input type="number" step="0.1" placeholder="%" value={extras.media.umidade} onChange={(e) => handleExtraChange('media', 'umidade', e.target.value)} className="w-full text-center text-xs rounded border-gray-300 p-1 font-mono font-bold text-emerald-600" /></td>
                                            {/* Usuário */}
                                            <td className="p-1 border border-slate-300"><input type="text" placeholder="Nome" value={extras.usuario} onChange={(e) => setExtras(prev => ({ ...prev, usuario: e.target.value }))} className="w-24 text-center text-xs rounded border-gray-300 p-1" /></td>
                                        </tr>
                                    </tbody>

                            </div>

                            <div className="flex justify-end pt-4 gap-3 border-t border-slate-100">
                                <button type="button" onClick={onClose} className="px-6 py-3 text-sm font-bold text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">

                                    <Icons.Save className="w-4 h-4" /> Confirmar Coleta
                                </button>

        const ModalInput = ({ silo, isOpen, onClose, onSave, onSetStatus, onUpdate }) => {
            if (!isOpen || !silo) return null;
            const [formData, setFormData] = useState({ history: [], ...silo });
            const [isColetaModalOpen, setIsColetaModalOpen] = useState(false);

            const hasProduct = formData.cultura && formData.cultura !== 'Vazio';

            useEffect(() => {
                const isEmpty = !silo.cultura || silo.cultura === 'Vazio';

                let initialTemp = isEmpty ? '' : silo.temp;
                let initialUmidade = isEmpty ? '' : silo.umidade;

                // Se houver histórico, recupera os dados da última coleta (maior número) para preencher os inputs

                        });
                        await batch.commit();
                        return; // O snapshot será disparado novamente após o commit
                    }

                    const newData = { preSecagem: [], armazenamento: [], metalicos: [] };

                    snapshot.forEach(doc => {
                        const silo = doc.data();
                        // Categoriza baseado no ID ou Tipo
                        if (silo.id.startsWith('PS')) newData.preSecagem.push(silo);
                        else if (silo.id.startsWith('AZ')) newData.armazenamento.push(silo);
                        else if (silo.id.startsWith('MT')) newData.metalicos.push(silo);
                    });

                    // Ordenar por ID numérico simples
                    const sortFn = (a, b) => {
                        const numA = parseInt(a.id.split('-')[1]);
                        const numB = parseInt(b.id.split('-')[1]);
                        return numA - numB;
                    };

                    newData.preSecagem.sort(sortFn);
                    newData.armazenamento.sort(sortFn);
                    newData.metalicos.sort(sortFn);

                    setData(newData);
                    setLoading(false);
                    setError(null); // Limpa erros anteriores em caso de sucesso
                }, (err) => {
                    console.error("Erro no listener do Firestore:", err);
                    setError("Permissão negada. Verifique se você está logado e se as regras de segurança estão corretas.");
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            const handleUpdateSilo = async (category, updatedSilo) => {
                // Atualiza diretamente no Firestore. O listener acima atualizará a UI.
                try {
                    await setDoc(doc(db, "mes_silos", updatedSilo.id), updatedSilo);
                } catch (error) {
                    console.error("Erro ao atualizar silo:", error);
                    alert("Erro ao salvar dados no servidor.");
                }
            };

            const handleSetStatus = async (siloToUpdate, newStatus, marcoldName = null) => {
                try {
                    const updateData = { status: newStatus };
                    if (newStatus === 'cooling' && marcoldName) {
                        updateData.marcold = marcoldName;
                    } else if (newStatus !== 'cooling') {
                        updateData.marcold = null;
                    }
                    await setDoc(doc(db, "mes_silos", siloToUpdate.id), updateData, { merge: true });
                } catch (error) {
                    console.error("Erro ao definir status:", error);
                    alert("Erro ao atualizar status do silo.");
                }
            };

            const handleStartTranshipment = (silo) => {
                setTranshipmentSourceSilo(silo);
                setTranshipmentModalOpen(true);
            };

            const handleStartDischarge = (silo) => {
                setDischargeSourceSilo(silo);
                setDischargeSelectionModalOpen(true);
            };

            const handleDischargeSelection = async (destination) => {
                if (destination === 'Secadores') {
                    localStorage.setItem('discharge_source_silo', JSON.stringify(dischargeSourceSilo));

                    // Esvaziar o silo de origem no Firebase
                    if (dischargeSourceSilo && dischargeSourceSilo.id) {
                        try {
                            const siloRef = doc(db, "mes_silos", dischargeSourceSilo.id);
                            await updateDoc(siloRef, {
                                cultura: 'Vazio', cultivar: '', pesoCargaKg: 0, peso: 0, pesoLiquido: 0,
                                cargas: [], history: [], status: 'normal', marcold: null,
                                moegaOrigem: '', fazenda: '', zona: '', talhao: '', impureza: '', observacao: '',
                                lastUpdate: new Date().toLocaleTimeString()
                            });
                        } catch (error) {
                            console.error("Erro ao esvaziar silo:", error);
                            alert("Erro ao atualizar o silo de origem no banco de dados.");
                            return;
                        }
                    }

                    window.location.href = 'secador.html';
                } else if (destination === 'Transbordo') {
                    if (dischargeSourceSilo && dischargeSourceSilo.id) {
                        try {
                            // 1. Registrar Transferência
                            await addDoc(collection(db, "mes_transferencias"), {
                                originSilo: dischargeSourceSilo.name,
                                culture: dischargeSourceSilo.cultura,
                                cultivar: dischargeSourceSilo.cultivar || '',
                                weight: parseFloat(dischargeSourceSilo.pesoCargaKg || dischargeSourceSilo.peso || 0),
                                timestamp: new Date().toISOString(),
                                type: 'Transbordo',
                                user: auth.currentUser ? auth.currentUser.email : 'Sistema'
                            });

                            // 2. Esvaziar Silo
                            const siloRef = doc(db, "mes_silos", dischargeSourceSilo.id);
                            await updateDoc(siloRef, {
                                cultura: 'Vazio', cultivar: '', pesoCargaKg: 0, peso: 0, pesoLiquido: 0,
                                cargas: [], history: [], status: 'normal', marcold: null,
                                moegaOrigem: '', fazenda: '', zona: '', talhao: '', impureza: '', observacao: '',
                                lastUpdate: new Date().toLocaleTimeString()
                            });

                            setDischargeSelectionModalOpen(false);
                            setDischargeSourceSilo(null);
                            setActiveTab('transferencia');
                        } catch (error) {
                            console.error("Erro ao realizar transbordo:", error);
                            alert("Erro ao registrar transbordo.");
                        }
                    }
                } else {
                    alert(`Destino selecionado: ${destination} para o silo ${dischargeSourceSilo.name}`);
                    setDischargeSelectionModalOpen(false);
                    setDischargeSourceSilo(null);
                }
            };

            const handleExecuteTranshipment = async (destinationSilo, tonnage) => {
                if (!transhipmentSourceSilo || !destinationSilo || !tonnage) return;

                const sourceRef = doc(db, "mes_silos", transhipmentSourceSilo.id);
                const destRef = doc(db, "mes_silos", destinationSilo.id);

                try {
                    const batch = writeBatch(db);
                    const sourceDoc = await getDoc(sourceRef);
                    const destDoc = await getDoc(destRef);
                    if (!sourceDoc.exists() || !destDoc.exists()) throw new Error("Silo de origem ou destino não encontrado.");

                    const sourceData = sourceDoc.data();
                    const destData = destDoc.data();
                    const sourceWeight = parseFloat(sourceData.pesoCargaKg || 0);
                    const transferWeightKg = parseFloat(tonnage) * 1000;

                    // --- Update Source Silo ---
                    const remainingWeight = sourceWeight - transferWeightKg;
                    if (remainingWeight < 1) {
                        batch.update(sourceRef, { cultura: 'Vazio', cultivar: '', pesoCargaKg: 0, cargas: [], history: [], status: 'normal', marcold: null, moegaOrigem: '', fazenda: '', zona: '', talhao: '', impureza: '', observacao: '' });
                    } else {
                        batch.update(sourceRef, { pesoCargaKg: remainingWeight });
                    }

                    // --- Update Destination Silo ---
                    const destWeight = parseFloat(destData.pesoCargaKg || 0);
                    const newDestWeight = destWeight + transferWeightKg;

                    const transhipmentCarga = {
                        cultura: sourceData.cultura,
                        cultivar: sourceData.cultivar,
                        moegaOrigem: sourceData.moegaOrigem,
                        fazenda: sourceData.fazenda,
                        zona: sourceData.zona,
                        talhao: sourceData.talhao,
                        impureza: sourceData.impureza,
                        origemCarga: sourceData.origemCarga,
                        placaOrigem: sourceData.placaOrigem,
                        cultura: sourceData.cultura || 'Desconhecida',
                        cultivar: sourceData.cultivar || '',
                        moegaOrigem: sourceData.moegaOrigem || '',
                        fazenda: sourceData.fazenda || '',
                        zona: sourceData.zona || '',
                        talhao: sourceData.talhao || '',
                        impureza: sourceData.impureza || '',
                        origemCarga: sourceData.origemCarga || '',
                        placaOrigem: sourceData.placaOrigem || '',
                        pesoCargaKg: transferWeightKg,
                        timestamp: new Date().toISOString(),
                        origemTransilagem: transhipmentSourceSilo.id
                    };

                    const newDestCargas = [...(destData.cargas || []), transhipmentCarga];
                    
                    const destUpdateData = {
                        pesoCargaKg: newDestWeight,
                        cargas: newDestCargas,
                        lastUpdate: new Date().toLocaleTimeString(),
                        moegaOrigem: sourceData.moegaOrigem,
                        fazenda: sourceData.fazenda,
                        zona: sourceData.zona,
                        talhao: sourceData.talhao,
                        impureza: sourceData.impureza,
                        moegaOrigem: sourceData.moegaOrigem || '',
                        fazenda: sourceData.fazenda || '',
                        zona: sourceData.zona || '',
                        talhao: sourceData.talhao || '',
                        impureza: sourceData.impureza || '',
                        observacao: `PRODUTO DE TRANSILAGEM (Origem: ${transhipmentSourceSilo.name})`
                    };

                    if (destData.cultura === 'Vazio') {
                        destUpdateData.cultura = sourceData.cultura;
                        destUpdateData.cultivar = sourceData.cultivar;
                        destUpdateData.umidade = sourceData.umidade;
                        destUpdateData.temp = sourceData.temp;
                        destUpdateData.cultura = sourceData.cultura || 'Desconhecida';
                        destUpdateData.cultivar = sourceData.cultivar || '';
                        destUpdateData.umidade = sourceData.umidade || 0;
                        destUpdateData.temp = sourceData.temp || 0;
                        destUpdateData.status = 'normal';
                    } else {
                        destUpdateData.cultivar = `MISTURA: ${destData.cultivar} + ${sourceData.cultivar}`;
                        destUpdateData.umidade = sourceData.umidade;
                        destUpdateData.temp = sourceData.temp;
                        destUpdateData.cultivar = `MISTURA: ${destData.cultivar || ''} + ${sourceData.cultivar || ''}`;
                        destUpdateData.umidade = sourceData.umidade || destData.umidade || 0;
                        destUpdateData.temp = sourceData.temp || destData.temp || 0;
                    }

                    batch.update(destRef, destUpdateData);
                    await batch.commit();
                    alert('Transilagem concluída com sucesso!');
                    setTranshipmentModalOpen(false);
                } catch (error) {
                    console.error("Erro na transilagem:", error);
                    alert("Falha na operação de transilagem: " + error.message);
                }
            };

            const handleDeleteHistory = async (siloId, historyItem) => {
                if (!window.confirm(`Deseja excluir o registro de coleta #${historyItem.coleta} do ${historyItem.siloName}?`)) return;

                let targetSilo = null;
                // Procura em todas as categorias
                for (const cat in data) {
                    const found = data[cat].find(s => s.id === siloId);
                    if (found) {
                        targetSilo = found;
                        break;
                    }
                }

                if (!targetSilo) return;

                const newHistory = (targetSilo.history || []).filter(h => h.timestamp !== historyItem.timestamp);

                try {
                    await setDoc(doc(db, "mes_silos", siloId), { ...targetSilo, history: newHistory });
                } catch (error) {
                    console.error("Erro ao excluir histórico:", error);
                    alert("Erro ao excluir registro.");
                }
            };

            const tabs = [
                { id: 'preSecagem', label: 'Pré-Secagem (10)' },
                { id: 'armazenamento', label: 'Silos de Armazenamento' },
                { id: 'metalicos', label: 'Silos Metálicos' },
                { id: 'acompanhamento', label: 'Acompanhamento de Coletas' },
                { id: 'rastreabilidade', label: 'Rastreabilidade de Produto' },
                { id: 'lancamentoRetroativo', label: 'Lançamento de Descarga Retroativo' },
                { id: 'transferencia', label: 'Transferência / Transbordo' }
            ];

            if (error) {
                return <div className="text-center py-20 text-red-600 font-bold animate-fade-in">{error}</div>;
            }

            return (
                <div className="min-h-screen pb-10">
                    <header className="bg-slate-800 text-white shadow-lg mb-8">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <a href="menu.html" className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors text-slate-200 hover:text-white flex items-center gap-2 text-sm font-medium">
                                    <Icons.ArrowLeft />
                                    <span className="hidden sm:inline">Menu</span>
                                </a>
                                <h1 className="text-xl font-bold tracking-tight flex items-center gap-2 border-l border-slate-600 pl-4">
                                    <span className="text-blue-400">MES</span> Operacional
                                </h1>
                            </div>
                            <span className="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">Terminal: OPER-01</span>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800">Entrada de Dados</h2>
                                <p className="text-slate-500 text-sm">Selecione o silo para atualizar as leituras.</p>
                            </div>

                            <div className="flex bg-white rounded-lg p-1 shadow-sm border border-slate-200">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab === tab.id
                                            ? 'bg-blue-600 text-white shadow'
                                            : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                                            }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {activeTab === 'acompanhamento' ? (
                            <AcompanhamentoTab data={data} onDelete={handleDeleteHistory} />
                        ) : activeTab === 'rastreabilidade' ? (
                            <RastreabilidadeTab data={data} />
                        ) : activeTab === 'lancamentoRetroativo' ? (
                            <LancamentoRetroativoTab />
                        ) : activeTab === 'transferencia' ? (
                            <TransferenciaTab />
                        ) : loading ? (
                            <div className="text-center py-20 text-slate-500">Carregando dados dos silos...</div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in">
                                {data[activeTab].map(silo => (
                                    <SiloCard
                                        key={silo.id}
                                        silo={silo}
                                        airHumidity={weather.humidity}
                                        airHumidityError={weather.error}
                                        onSetStatus={handleSetStatus}
                                        onStartTranshipment={handleStartTranshipment}
                                        onStartDischarge={handleStartDischarge}
                                        onOpenMarcoldModal={setSelectedSiloForMarcold}
                                        onClick={setSelectedSilo}
                                    />
                                ))}
                            </div>
                        )}
                    </main>

                    <ModalInput
                        isOpen={!!selectedSilo}
                        silo={selectedSilo}
                        onClose={() => setSelectedSilo(null)}
                        onSave={(updatedSilo) => {
                            handleUpdateSilo(activeTab, updatedSilo);
                            setSelectedSilo(null);
                        }}
                        onSetStatus={handleSetStatus}
                        onUpdate={(updatedSilo) => handleUpdateSilo(activeTab, updatedSilo)}
                    />

                    <MarcoldSelectionModal
                        isOpen={!!selectedSiloForMarcold}
                        onClose={() => setSelectedSiloForMarcold(null)}
                        onSelect={(marcoldName) => {
                            handleSetStatus(selectedSiloForMarcold, 'cooling', marcoldName);
                            setSelectedSiloForMarcold(null);
                        }}
                    />

                    <TranshipmentModal
                        isOpen={transhipmentModalOpen}
                        onClose={() => setTranshipmentModalOpen(false)}
                        allSilos={data}
                        sourceSilo={transhipmentSourceSilo}
                        onConfirm={handleExecuteTranshipment}
                    />

                    <DischargeSelectionModal
                        isOpen={dischargeSelectionModalOpen}
                        onClose={() => setDischargeSelectionModalOpen(false)}
                        onSelect={handleDischargeSelection}
                    />
                </div>
            );
        };

        // --- Componente de Autenticação ---
        const AuthWrapper = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    setUser(user);
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (authLoading) {
                return <div className="text-center py-40 text-slate-500 font-semibold">Conectando...</div>;
            }

            // O usuário já deve estar logado para acessar esta página.
            // Se não estiver, algumas funcionalidades podem não funcionar,
            // mas a tela de login foi removida conforme solicitado.
            return <App />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthWrapper />);
    </script>
</body>

</html>
