<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Agro - Interface Operacional</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, writeBatch, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { firebaseConfig } from './firebase_config.js';

        // --- Inicialização Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect } = React;

        // --- Configuração Inicial e Utilitários ---
        // const STORAGE_KEY = 'mes_agro_data'; // Depreciado em favor do Firestore

        const generateSilos = (count, prefix, type) => {
            return Array.from({ length: count }, (_, i) => ({
                id: `${prefix}-${i + 1}`,
                name: `${type} ${i + 1}`,
                type: type,
                temp: (20 + Math.random() * 10).toFixed(1),
                umidade: (12 + Math.random() * 4).toFixed(1),
                urAr: (40 + Math.random() * 20).toFixed(1),
                cultura: 'Vazio',
                cultivar: '',
                coleta: '',
                lastUpdate: new Date().toLocaleTimeString(),
                status: 'normal'
            }));
        };

        // Dados iniciais apenas para popular o banco na primeira execução
        const SEED_DATA = [
            ...generateSilos(10, 'PS', 'Pré-Secagem'),
            ...generateSilos(20, 'AZ', 'Armazenamento'),
            ...generateSilos(10, 'MT', 'Metálico')
        ];

        // --- Ícones ---
        const Icons = {
            Thermometer: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" /><path d="M15 2h-6" /></svg>,
            Droplet: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-6-9-7-9S5 8 5 15a7 7 0 0 0 7 7Z" /><path d="m9 12 2 2 4-4" /></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" /></svg>,
            Save: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></svg>,
            ArrowLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>
        };

        // --- Componentes ---
        const SiloCard = ({ silo, onClick }) => {
            const getStatusColor = () => {
                if (parseFloat(silo.temp) > 35 || parseFloat(silo.umidade) > 16) return 'bg-red-50 border-red-400 text-red-900';
                if (parseFloat(silo.temp) > 30 || parseFloat(silo.umidade) > 14) return 'bg-yellow-50 border-yellow-400 text-yellow-900';
                if (silo.cultura === 'Vazio') return 'bg-white border-gray-300 text-gray-500';
                return 'bg-green-50 border-green-400 text-green-900';
            };

            return (
                <div
                    onClick={() => onClick(silo)}
                    className={`p-4 rounded-lg border-l-4 shadow-sm cursor-pointer hover:shadow-md hover:scale-[1.02] transition-all ${getStatusColor()}`}
                >
                    <div className="flex justify-between items-center mb-2">
                        <span className="font-bold text-lg">{silo.name}</span>
                        <span className="text-xs px-2 py-1 rounded bg-white/60 font-medium border border-black/10">{silo.cultura || 'Vazio'}</span>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-sm font-medium">
                        <div className="flex items-center gap-1"><Icons.Thermometer /> {silo.temp}°C</div>
                        <div className="flex items-center gap-1"><Icons.Droplet /> {silo.umidade}%</div>
                    </div>
                    <div className="mt-3 text-[10px] uppercase tracking-wide opacity-70">
                        Atualizado: {silo.lastUpdate}
                    </div>
                </div>
            );
        };

        const ModalInput = ({ silo, isOpen, onClose, onSave }) => {
            if (!isOpen || !silo) return null;
            const [formData, setFormData] = useState({ ...silo });

            useEffect(() => { setFormData({ ...silo }); }, [silo]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                let status = 'normal';
                if (parseFloat(formData.temp) > 35 || parseFloat(formData.umidade) > 16) status = 'critical';
                else if (parseFloat(formData.temp) > 30 || parseFloat(formData.umidade) > 14) status = 'warning';

                onSave({
                    ...formData,
                    status,
                    lastUpdate: new Date().toLocaleTimeString()
                });
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
                        <div className="bg-blue-600 px-6 py-4 flex justify-between items-center">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Edit /> Editar {silo.name}</h3>
                            <button onClick={onClose} className="text-white hover:text-blue-200 text-2xl">&times;</button>
                        </div>

                        <form onSubmit={handleSubmit} className="p-6 space-y-5">
                            <div className="grid grid-cols-2 gap-5">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">Temperatura (°C)</label>
                                    <input type="number" step="0.1" name="temp" value={formData.temp} onChange={handleChange} className="w-full rounded border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2.5 text-lg" required />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">Umidade Grão (%)</label>
                                    <input type="number" step="0.1" name="umidade" value={formData.umidade} onChange={handleChange} className="w-full rounded border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2.5 text-lg" required />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-5">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Umidade Ar (%UR)</label>
                                    <input type="number" step="0.1" name="urAr" value={formData.urAr} onChange={handleChange} className="w-full rounded border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Nº Coleta</label>
                                    <input type="text" name="coleta" value={formData.coleta} onChange={handleChange} className="w-full rounded border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2" placeholder="Ex: A-12" />
                                </div>
                            </div>

                            <div className="border-t pt-4 mt-2">
                                <label className="block text-sm font-bold text-slate-700 mb-1">Cultura</label>
                                <select name="cultura" value={formData.cultura} onChange={handleChange} className="w-full rounded border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2 mb-4 bg-slate-50">
                                    <option value="Vazio">-- Silo Vazio --</option>
                                    <option value="Soja">Soja</option>
                                    <option value="Milho">Milho</option>
                                    <option value="Trigo">Trigo</option>
                                    <option value="Arroz">Arroz</option>
                                    <option value="Feijão">Feijão</option>
                                </select>

                                <label className="block text-sm font-medium text-slate-700 mb-1">Cultivar / Observação</label>
                                <input type="text" name="cultivar" value={formData.cultivar} onChange={handleChange} className="w-full rounded border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2" placeholder="Ex: Intacta 2 Xtend" />
                            </div>

                            <div className="flex justify-end pt-4 gap-3">
                                <button type="button" onClick={onClose} className="px-5 py-2.5 text-sm font-medium text-slate-700 bg-slate-100 border border-slate-300 rounded hover:bg-slate-200 transition-colors">Cancelar</button>
                                <button type="submit" className="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700 shadow-lg hover:shadow-xl transition-all flex items-center gap-2">
                                    <Icons.Save /> Salvar Dados
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('preSecagem');
            const [selectedSilo, setSelectedSilo] = useState(null);
            const [data, setData] = useState({
                preSecagem: [],
                armazenamento: [],
                metalicos: []
            });
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // --- Conexão com Firestore ---
            useEffect(() => {
                const q = query(collection(db, "mes_silos"));

                const unsubscribe = onSnapshot(q, async (snapshot) => {
                    if (snapshot.empty && loading) {
                        setLoading(true); // Garante que o estado de loading seja verdadeiro
                        // Se o banco estiver vazio, popula com dados iniciais (Seed)
                        console.log("Banco vazio. Criando silos iniciais...");
                        const batch = writeBatch(db);
                        SEED_DATA.forEach(silo => {
                            const ref = doc(db, "mes_silos", silo.id);
                            batch.set(ref, silo);
                        });
                        await batch.commit();
                        return; // O snapshot será disparado novamente após o commit
                    }

                    const newData = { preSecagem: [], armazenamento: [], metalicos: [] };

                    snapshot.forEach(doc => {
                        const silo = doc.data();
                        // Categoriza baseado no ID ou Tipo
                        if (silo.id.startsWith('PS')) newData.preSecagem.push(silo);
                        else if (silo.id.startsWith('AZ')) newData.armazenamento.push(silo);
                        else if (silo.id.startsWith('MT')) newData.metalicos.push(silo);
                    });

                    // Ordenar por ID numérico simples
                    const sortFn = (a, b) => {
                        const numA = parseInt(a.id.split('-')[1]);
                        const numB = parseInt(b.id.split('-')[1]);
                        return numA - numB;
                    };

                    newData.preSecagem.sort(sortFn);
                    newData.armazenamento.sort(sortFn);
                    newData.metalicos.sort(sortFn);

                    setData(newData);
                    setLoading(false);
                    setError(null); // Limpa erros anteriores em caso de sucesso
                }, (err) => {
                    console.error("Erro no listener do Firestore:", err);
                    setError("Permissão negada. Verifique se você está logado e se as regras de segurança estão corretas.");
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            const handleUpdateSilo = async (category, updatedSilo) => {
                // Atualiza diretamente no Firestore. O listener acima atualizará a UI.
                try {
                    await setDoc(doc(db, "mes_silos", updatedSilo.id), updatedSilo);
                } catch (error) {
                    console.error("Erro ao atualizar silo:", error);
                    alert("Erro ao salvar dados no servidor.");
                }
            };

            const tabs = [
                { id: 'preSecagem', label: 'Pré-Secagem (10)' },
                { id: 'armazenamento', label: 'Armazenamento (20)' },
                { id: 'metalicos', label: 'Metálicos (10)' }
            ];

            if (error) {
                return <div className="text-center py-20 text-red-600 font-bold animate-fade-in">{error}</div>;
            }

            return (
                <div className="min-h-screen pb-10">
                    <header className="bg-slate-800 text-white shadow-lg mb-8">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <a href="menu.html" className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors text-slate-200 hover:text-white flex items-center gap-2 text-sm font-medium">
                                    <Icons.ArrowLeft />
                                    <span className="hidden sm:inline">Menu</span>
                                </a>
                                <h1 className="text-xl font-bold tracking-tight flex items-center gap-2 border-l border-slate-600 pl-4">
                                    <span className="text-blue-400">MES</span> Operacional
                                </h1>
                            </div>
                            <span className="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">Terminal: OPER-01</span>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800">Entrada de Dados</h2>
                                <p className="text-slate-500 text-sm">Selecione o silo para atualizar as leituras.</p>
                            </div>

                            <div className="flex bg-white rounded-lg p-1 shadow-sm border border-slate-200">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab === tab.id
                                                ? 'bg-blue-600 text-white shadow'
                                                : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                                            }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {loading ? (
                            <div className="text-center py-20 text-slate-500">Carregando dados dos silos...</div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-4 animate-fade-in">
                                {data[activeTab].map(silo => (
                                    <SiloCard
                                        key={silo.id}
                                        silo={silo}
                                        onClick={setSelectedSilo}
                                    />
                                ))}
                            </div>
                        )}
                    </main>

                    <ModalInput
                        isOpen={!!selectedSilo}
                        silo={selectedSilo}
                        onClose={() => setSelectedSilo(null)}
                        onSave={(updatedSilo) => {
                            handleUpdateSilo(activeTab, updatedSilo);
                            setSelectedSilo(null);
                        }}
                    />
                </div>
            );
        };

        // --- Componente de Autenticação ---
        const AuthWrapper = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    setUser(user);
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (authLoading) {
                return <div className="text-center py-40 text-slate-500 font-semibold">Verificando autenticação...</div>;
            }

            if (!user) {
                return (
                    <div className="text-center py-40 text-red-600 font-bold">
                        <p>Acesso Negado. Você precisa estar logado para ver esta página.</p>
                        <a href="index.html" className="mt-4 inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Ir para a página de Login</a>
                    </div>
                );
            }

            return <App />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthWrapper />);
    </script>
</body>

</html>
