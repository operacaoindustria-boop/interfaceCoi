<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Operador - Secagem</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Animações simples */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Ícones SVG (Substituindo Lucide-React para funcionar direto no browser) ---
        const Icons = {
            Activity: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Wind: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
            AlertTriangle: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            Save: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            Square: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg>,
            Snowflake: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/></svg>,
            CheckCircle: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            ArrowLeft: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        };

        // --- Dados Simulados ---
        const INITIAL_DRYERS = [
          { id: 1, name: 'Silo 01', status: 'drying', product: 'Soja BMX', batch: 'Lote-A102', tempAir: 55, tempMass: 38, moisture: 16.5, targetMoisture: 13.0 },
          { id: 2, name: 'Silo 02', status: 'cooling', product: 'Milho 2B', batch: 'Lote-B440', tempAir: 25, tempMass: 32, moisture: 13.2, targetMoisture: 13.0 },
          { id: 3, name: 'Silo 03', status: 'stopped', product: 'Vazio', batch: '-', tempAir: 24, tempMass: 24, moisture: 0, targetMoisture: 13.0 },
          { id: 4, name: 'Silo 04', status: 'drying', product: 'Soja Bras', batch: 'Lote-C991', tempAir: 58, tempMass: 40, moisture: 15.1, targetMoisture: 12.5 },
        ];

        // --- Componentes UI ---
        const Card = ({ children, className = "" }) => (
          <div className={`bg-white rounded-xl shadow-sm border border-slate-200 ${className}`}>
            {children}
          </div>
        );

        const StatusBadge = ({ status }) => {
          const styles = {
            drying: 'bg-orange-100 text-orange-700 border-orange-200',
            cooling: 'bg-blue-100 text-blue-700 border-blue-200',
            stopped: 'bg-slate-100 text-slate-600 border-slate-200',
          };
          const labels = { drying: 'Secando', cooling: 'Resfriando', stopped: 'Parado' };
          const Icon = {
            drying: Icons.Wind,
            cooling: Icons.Snowflake,
            stopped: Icons.Square,
          }[status];

          return (
            <span className={`flex items-center px-2.5 py-1 rounded-full text-xs font-semibold border ${styles[status]}`}>
              <Icon className="w-3 h-3 mr-1" />
              {labels[status]}
            </span>
          );
        };

        // --- App Principal ---
        function OperatorApp() {
          const [dryers, setDryers] = useState(INITIAL_DRYERS);
          const [selectedDryerId, setSelectedDryerId] = useState(dryers[0].id);
          const [formData, setFormData] = useState({ tempAir: 0, tempMass: 0, moisture: 0 });
          const [lastSaved, setLastSaved] = useState(null);

          const selectedDryer = dryers.find(d => d.id === selectedDryerId);

          useEffect(() => {
            if (selectedDryer) {
              setFormData({
                tempAir: selectedDryer.tempAir,
                tempMass: selectedDryer.tempMass,
                moisture: selectedDryer.moisture
              });
            }
          }, [selectedDryerId]);

          const handleInputChange = (field, value) => {
            setFormData(prev => ({ ...prev, [field]: parseFloat(value) }));
          };

          const handleStepper = (field, delta) => {
            setFormData(prev => ({ ...prev, [field]: parseFloat((prev[field] + delta).toFixed(1)) }));
          };

          const handleStatusChange = (id, newStatus) => {
            setDryers(prev => prev.map(d => d.id === id ? { ...d, status: newStatus } : d));
          };

          const handleSubmit = (e) => {
            e.preventDefault();
            setDryers(prev => prev.map(d => d.id === selectedDryerId ? { ...d, ...formData } : d));
            setLastSaved(new Date());
            setTimeout(() => setLastSaved(null), 3000);
          };

          return (
            <div className="min-h-screen bg-slate-100 p-4 md:p-6 font-sans">
              <div className="max-w-4xl mx-auto">
                <header className="mb-6 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                  <div className="flex items-center">
                    <a href="menu.html" className="mr-4 p-2 bg-slate-100 rounded-lg hover:bg-slate-200 text-slate-600 transition-colors">
                        <Icons.ArrowLeft className="w-5 h-5" />
                    </a>
                    <div>
                        <h1 className="text-xl font-bold text-slate-800">Painel do Operador</h1>
                        <p className="text-xs text-slate-500">Terminal ID: #OP-04</p>
                    </div>
                  </div>
                  <div className="flex items-center space-x-2 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">
                    <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span className="text-sm font-medium text-blue-900">Online</span>
                  </div>
                </header>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                  {dryers.map(dryer => (
                    <button
                      key={dryer.id}
                      onClick={() => setSelectedDryerId(dryer.id)}
                      className={`p-4 rounded-xl border-2 transition-all text-left relative overflow-hidden ${
                        selectedDryerId === dryer.id
                          ? 'border-blue-600 bg-blue-50 ring-2 ring-blue-200'
                          : 'border-slate-200 bg-white hover:border-blue-300'
                      }`}
                    >
                      <div className="flex justify-between items-start mb-2">
                        <span className="font-bold text-lg text-slate-700">{dryer.name}</span>
                        <div className={`w-3 h-3 rounded-full ${
                          dryer.status === 'drying' ? 'bg-orange-500 animate-pulse' : 
                          dryer.status === 'cooling' ? 'bg-blue-500' : 'bg-slate-300'
                        }`} />
                      </div>
                      <p className="text-xs text-slate-500 truncate">{dryer.product}</p>
                    </button>
                  ))}
                </div>

                {selectedDryer && (
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fade-in">
                    
                    <div className="lg:col-span-2 space-y-6">
                      <Card className="p-6 border-l-4 border-l-blue-600">
                        <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                          <h3 className="text-lg font-bold text-slate-800 flex items-center">
                            <Icons.Activity className="w-5 h-5 mr-2 text-blue-600" />
                            Leitura: {selectedDryer.name}
                          </h3>
                          <StatusBadge status={selectedDryer.status} />
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-6">
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                              <label className="block text-sm font-semibold text-slate-600 mb-2">Temp. Ar (°C)</label>
                              <div className="flex items-center space-x-2">
                                <button type="button" onClick={() => handleStepper('tempAir', -1)} className="w-10 h-10 bg-white border rounded-lg text-lg font-bold shadow-sm active:bg-slate-100">-</button>
                                <input 
                                  type="number" 
                                  value={formData.tempAir}
                                  onChange={(e) => handleInputChange('tempAir', e.target.value)}
                                  className="w-full h-10 text-center text-xl font-bold text-slate-800 rounded-lg border-slate-300 border focus:ring-2 focus:ring-blue-500 outline-none"
                                />
                                <button type="button" onClick={() => handleStepper('tempAir', 1)} className="w-10 h-10 bg-white border rounded-lg text-lg font-bold shadow-sm active:bg-slate-100">+</button>
                              </div>
                            </div>

                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                              <label className="block text-sm font-semibold text-slate-600 mb-2">Temp. Massa (°C)</label>
                              <div className="flex items-center space-x-2">
                                <button type="button" onClick={() => handleStepper('tempMass', -0.5)} className="w-10 h-10 bg-white border rounded-lg text-lg font-bold shadow-sm active:bg-slate-100">-</button>
                                <input 
                                  type="number" 
                                  value={formData.tempMass}
                                  onChange={(e) => handleInputChange('tempMass', e.target.value)}
                                  className={`w-full h-10 text-center text-xl font-bold rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none ${formData.tempMass > 42 ? 'text-red-600 bg-red-50' : 'text-slate-800'}`}
                                />
                                <button type="button" onClick={() => handleStepper('tempMass', 0.5)} className="w-10 h-10 bg-white border rounded-lg text-lg font-bold shadow-sm active:bg-slate-100">+</button>
                              </div>
                               {formData.tempMass > 42 && (
                                <p className="text-xs text-red-600 mt-2 font-bold flex items-center animate-pulse">
                                  <Icons.AlertTriangle className="w-3 h-3 mr-1" /> ALERTA CRÍTICO
                                </p>
                              )}
                            </div>

                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 md:col-span-2">
                              <label className="block text-sm font-semibold text-slate-600 mb-2 text-center">Umidade da Amostra (%)</label>
                              <div className="flex items-center justify-center space-x-6">
                                <button type="button" onClick={() => handleStepper('moisture', -0.1)} className="w-16 h-16 bg-white border rounded-2xl text-3xl font-bold shadow-sm active:bg-slate-100 text-slate-500 hover:text-slate-700">-</button>
                                <div className="text-center">
                                   <input 
                                    type="number" 
                                    step="0.1"
                                    value={formData.moisture}
                                    onChange={(e) => handleInputChange('moisture', e.target.value)}
                                    className="w-32 text-center text-5xl font-extrabold text-blue-600 bg-transparent outline-none"
                                  />
                                </div>
                                <button type="button" onClick={() => handleStepper('moisture', 0.1)} className="w-16 h-16 bg-white border rounded-2xl text-3xl font-bold shadow-sm active:bg-slate-100 text-slate-500 hover:text-slate-700">+</button>
                              </div>
                            </div>
                          </div>

                          <button 
                            type="submit"
                            className="w-full bg-blue-600 hover:bg-blue-700 text-white h-20 rounded-xl text-2xl font-bold shadow-lg shadow-blue-200 flex items-center justify-center transition-transform active:scale-95"
                          >
                            <Icons.Save className="w-8 h-8 mr-3" />
                            CONFIRMAR
                          </button>
                        </form>

                        {lastSaved && (
                          <div className="mt-4 p-4 bg-green-100 text-green-800 rounded-xl text-center font-bold flex items-center justify-center animate-fade-in">
                            <Icons.CheckCircle className="w-6 h-6 mr-2" />
                            Salvo às {lastSaved.toLocaleTimeString()}
                          </div>
                        )}
                      </Card>
                    </div>

                    <div className="space-y-6">
                      <Card className="p-6">
                        <h4 className="text-xs font-bold text-slate-500 uppercase mb-4 tracking-wider">Ações de Controle</h4>
                        <div className="space-y-3">
                          <button 
                            onClick={() => handleStatusChange(selectedDryer.id, 'drying')}
                            disabled={selectedDryer.status === 'drying'}
                            className={`w-full p-4 rounded-xl border-2 font-bold flex items-center justify-center transition-colors ${selectedDryer.status === 'drying' ? 'border-orange-500 bg-orange-50 text-orange-700 opacity-50 cursor-not-allowed' : 'border-slate-100 hover:border-orange-300 text-slate-600'}`}
                          >
                            <Icons.Wind className="w-5 h-5 mr-2" /> Secar
                          </button>
                          <button 
                            onClick={() => handleStatusChange(selectedDryer.id, 'cooling')}
                            disabled={selectedDryer.status === 'cooling'}
                            className={`w-full p-4 rounded-xl border-2 font-bold flex items-center justify-center transition-colors ${selectedDryer.status === 'cooling' ? 'border-blue-500 bg-blue-50 text-blue-700 opacity-50 cursor-not-allowed' : 'border-slate-100 hover:border-blue-300 text-slate-600'}`}
                          >
                            <Icons.Snowflake className="w-5 h-5 mr-2" /> Resfriar
                          </button>
                          <button 
                            onClick={() => handleStatusChange(selectedDryer.id, 'stopped')}
                            disabled={selectedDryer.status === 'stopped'}
                            className={`w-full p-4 rounded-xl border-2 font-bold flex items-center justify-center transition-colors ${selectedDryer.status === 'stopped' ? 'border-slate-500 bg-slate-100 text-slate-700 opacity-50 cursor-not-allowed' : 'border-slate-100 hover:border-slate-300 text-slate-600'}`}
                          >
                            <Icons.Square className="w-5 h-5 mr-2" /> Parar
                          </button>
                        </div>
                      </Card>

                      <div className="bg-slate-800 text-white p-6 rounded-xl shadow-sm">
                        <h4 className="text-xs font-bold text-slate-400 uppercase mb-4">Detalhes do Lote</h4>
                        <div className="space-y-4">
                          <div>
                            <span className="block text-xs text-slate-400">Produto</span>
                            <span className="text-xl font-bold">{selectedDryer.product}</span>
                          </div>
                          <div className="pt-2 border-t border-slate-700">
                            <span className="block text-xs text-slate-400">Rastreabilidade</span>
                            <span className="text-lg font-mono text-yellow-400">{selectedDryer.batch}</span>
                          </div>
                          <div className="pt-2 border-t border-slate-700">
                            <span className="block text-xs text-slate-400">Meta Umidade</span>
                            <span className="text-lg">{selectedDryer.targetMoisture}%</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OperatorApp />);
    </script>
</body>
</html>
