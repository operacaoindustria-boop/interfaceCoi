<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento Operacional - Indústria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
        }
        .fixed-feedback {
            position: static; /* Default to static for mobile-first */
            max-width: 100%;
            text-align: center;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            border-radius: 0;
        }
        @media (min-width: 640px) { /* sm breakpoint from Tailwind */
            .fixed-feedback {
                position: sticky;
                top: 70px; /* Position below the sticky header */
                z-index: 50;
                max-width: 90%;
                width: fit-content;
                border-radius: 0.375rem; /* Tailwind's rounded-md */
            }
        }
        
        /* Melhora a responsividade em telas menores */
        @media (max-width: 639px) {
            .header-title {
                font-size: 1rem; /* Reduz o tamanho da fonte do título */
            }
            .header-button {
                padding: 0.25rem 0.5rem; /* Reduz o padding dos botões */
                font-size: 0.875rem;
            }
            .form-buttons {
                flex-direction: column; /* Empilha os botões */
            }
            .form-buttons button {
                width: 100%; /* Botões com largura total */
            }
        }

        /* Ajuste para telas muito grandes */
        @media (min-width: 1536px) { /* 2xl breakpoint */
            .sector-grid {
                grid-template-columns: repeat(5, 1fr); /* 5 colunas em telas muito grandes */
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useContext, createContext } = React;

        // --- Configuração do Firebase ---
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyB_ZscXHOoNP1Xkm-C6WLqhwEFcTsBk3GQ",
            authDomain: "integracaocoi.firebaseapp.com",
            projectId: "integracaocoi",
            storageBucket: "integracaocoi.firebasestorage.app",
            messagingSenderId: "177203745489",
            appId: "1:177203745489:web:b86bbc4e96830e06032bf0"
        };

        // Inicializa Firebase
        const app = firebase.initializeApp(FIREBASE_CONFIG);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const PUBLIC_PLANNING_PATH = 'planejamento_coi/status_publico';

        // --- Contexto de Autenticação ---
        const AuthContext = createContext(null);

        const AuthProvider = ({ children }) => {
            const [currentUser, setCurrentUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setCurrentUser(user);
                    setLoading(false);
                });
                return unsubscribe;
            }, []);

            const value = { currentUser, loading, auth, db };

            return (
                <AuthContext.Provider value={value}>
                    {children}
                </AuthContext.Provider>
            );
        };

        // --- Tela de Login ---
        const LoginScreen = () => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [error, setError] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');

                if (isRegistering) {
                    if (password !== confirmPassword) {
                        setError("As senhas não coincidem.");
                        return;
                    }
                    try {
                        await auth.createUserWithEmailAndPassword(email, password);
                        // O onAuthStateChanged irá lidar com o redirecionamento
                    } catch (err) {
                        console.error("Erro de Cadastro:", err);
                        if (err.code === 'auth/email-already-in-use') {
                            setError("Este e-mail já está em uso.");
                        } else if (err.code === 'auth/weak-password') {
                            setError("A senha deve ter no mínimo 6 caracteres.");
                        } else {
                            setError("Falha no cadastro. Verifique o console.");
                        }
                    }
                } else {
                    try {
                        await auth.signInWithEmailAndPassword(email, password);
                    } catch (err) {
                        console.error("Erro de Autenticação:", err);
                        if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
                            setError("E-mail ou senha inválidos.");
                        } else {
                            setError("Falha na autenticação. Verifique o console.");
                        }
                    }
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-gray-100 px-4" style={{background: 'linear-gradient(to right, #6a11cb, #2575fc)'}}>
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-200">
                        <div className="text-center mb-8">
                            {/* Você pode adicionar um logo aqui */}
                            <h1 className="text-3xl font-bold text-gray-800">Bem-vindo</h1>
                            <p className="text-gray-500">{isRegistering ? "Crie sua conta para continuar" : "Faça login para acessar o painel"}</p>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-600 mb-1">E-mail</label>
                                <input
                                    type="email"
                                    required
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                                    placeholder="seu.email@exemplo.com"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-600 mb-1">Senha</label>
                                <input
                                    type="password"
                                    required
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                                    placeholder="********"
                                />
                            </div>
                            {isRegistering && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-600 mb-1">Confirmar Senha</label>
                                    <input
                                        type="password"
                                        required
                                        value={confirmPassword}
                                        onChange={(e) => setConfirmPassword(e.target.value)}
                                        className="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                                        placeholder="********"
                                    />
                                </div>
                            )}
                            {error && <p className="text-red-500 text-sm text-center">{error}</p>}
                            <div>
                                <button
                                    type="submit"
                                    className="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-md font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-transform transform hover:scale-105"
                                >
                                    {isRegistering ? 'Cadastrar' : 'Entrar'}
                                </button>
                            </div>
                        </form>
                        <div className="mt-6 text-center">
                            <a
                                href="#"
                                onClick={(e) => {
                                    e.preventDefault();
                                    setIsRegistering(!isRegistering);
                                    setError('');
                                    setConfirmPassword('');
                                }}
                                className="text-sm text-indigo-600 hover:text-indigo-500"
                            >
                                {isRegistering ? 'Já tem uma conta? Faça login' : 'Não tem uma conta? Cadastre-se'}
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Formulário de Planejamento (Interface A) ---
        const PlanningForm = () => {
            const { currentUser, db } = useContext(AuthContext);
            const [feedback, setFeedback] = useState('');
            const [feedbackType, setFeedbackType] = useState('success');
            const [sectorsState, setSectorsState] = useState({});
            const [contextState, setContextState] = useState({ data: '', turno: 'TURNO: A' });

            const SECTORS_LIST = [
                { name: 'ADUBO', id: 'adubo' },
                { name: 'CRISTO REI', id: 'cristo-rei' },
                { name: 'ENSAQUE', id: 'ensaque' },
                { name: 'GRANELEIRO AGROCEMA', id: 'graneleiro-agrocema' },
                { name: 'GRANELEIRO SEDE', id: 'graneleiro-sede' },
                { name: 'HARVER', id: 'harver' },
                { name: 'KSI', id: 'ksi' },
                { name: 'MARCOLDS', id: 'marcolds' },
                { name: 'MOEGA/RECEPÇÃO', id: 'moega-recepcao' },
                { name: 'MOMESSO LINHAS 1,2,3,4 E 5', id: 'momesso-linhas-12345' },
                { name: 'PELETIZAÇÃO', id: 'peletizacao' },
                { name: 'RAINHA DA SERRA', id: 'rainha-da-serra' },
                { name: 'SECAGEM SEDE', id: 'secagem-sede' },
                { name: 'SHAPARRAL', id: 'shaparral' },
                { name: 'SILOS E PRÉ SECAGENS', id: 'silos-e-pre-secagens' },
                { name: 'UBS BENEFICIAMENTO', id: 'ubs-beneficiamento' }
            ];

            const getDraftPath = () => `planejamento_coi_drafts/${currentUser.uid}/drafts/current_planning`;

            useEffect(() => {
                const loadInitialData = async () => {
                    if (!currentUser) return;
                    try {
                        const docRef = db.doc(getDraftPath());
                        const docSnap = await docRef.get();
                        
                        if (docSnap.exists) {
                            const data = docSnap.data();
                            const sectorsObj = {};
                            (data.setores || []).forEach(sector => {
                                const reconstructedStatus = (sector.atividades || []).map(act => act.text).join('\n');
                                sectorsObj[sector.id] = { status: reconstructedStatus, prioridade: sector.prioridade };
                            });
                            setSectorsState(sectorsObj);
                            setContextState({ data: data.data, turno: data.turno });
                            setFeedback('Rascunho anterior carregado.');
                        } else {
                            const now = new Date();
                            const dateString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                            setContextState(prev => ({ ...prev, data: dateString }));
                        }
                    } catch (e) {
                        console.error("Erro ao carregar rascunho:", e);
                        setFeedbackType('error');
                        setFeedback('Erro ao carregar rascunho.');
                    }
                };
                loadInitialData();
            }, [currentUser, db]);

            const saveDraft = async (dataToSave) => {
                if (!currentUser) return;
                try {
                    await db.doc(getDraftPath()).set(dataToSave);
                } catch (e) {
                    console.error("Falha ao salvar rascunho:", e);
                }
            };

            const handlePublish = async (e) => {
                e.preventDefault();
                
                const setoresArray = SECTORS_LIST.map(sector => {
                    const statusValue = sectorsState[sector.id]?.status || '';
                    const atividades = statusValue.split('\n').filter(line => line.trim() !== '').map(line => ({
                        text: line.trim(),
                        completed: false
                    }));

                    if (atividades.length === 0) {
                        return null;
                    }

                    return {
                        id: sector.id,
                        nome: sector.name,
                        atividades: atividades,
                        prioridade: sectorsState[sector.id]?.prioridade || 'NORMAL',
                        observacoes: sectorsState[sector.id]?.observacoes || ''
                    };
                }).filter(s => s !== null);

                const finalData = {
                    timestamp: Date.now(),
                    data: contextState.data,
                    turno: contextState.turno,
                    setores: setoresArray
                };

                if (!finalData.data || !finalData.turno || finalData.setores.length === 0) {
                    setFeedbackType('error');
                    setFeedback('Preencha a Data, o Turno e pelo menos um Status de Setor.');
                    return;
                }

                try {
                    await saveDraft(finalData);
                    await db.doc(PUBLIC_PLANNING_PATH).set(finalData);
                    setFeedbackType('success');
                    setFeedback('Planejamento salvo e atualizado com sucesso!');
                } catch (err) {
                    console.error("Erro ao publicar:", err);
                    setFeedbackType('error');
                    setFeedback('ERRO: Falha na publicação. Verifique as permissões do Firestore.');
                }
            };

            const openDashboard = () => {
                const baseUrl = window.location.href.split('?')[0];
                const dashboardUrl = `${baseUrl}?page=dashboard`;
                window.location.assign(dashboardUrl);
            };

            const handlePublishAndOpen = async (e) => {
                e.preventDefault();
                
                const setoresArray = SECTORS_LIST.map(sector => {
                    const statusValue = sectorsState[sector.id]?.status || '';
                    const atividades = statusValue.split('\n').filter(line => line.trim() !== '').map(line => ({
                        text: line.trim(),
                        completed: false
                    }));

                    if (atividades.length === 0) {
                        return null;
                    }

                    return {
                        id: sector.id,
                        nome: sector.name,
                        atividades: atividades,
                        prioridade: sectorsState[sector.id]?.prioridade || 'NORMAL'
                    };
                }).filter(s => s !== null);

                const finalData = {
                    timestamp: Date.now(),
                    data: contextState.data,
                    turno: contextState.turno,
                    setores: setoresArray
                };

                if (!finalData.data || !finalData.turno || finalData.setores.length === 0) {
                    setFeedbackType('error');
                    setFeedback('Preencha a Data, o Turno e pelo menos um Status de Setor.');
                    return;
                }

                try {
                    await saveDraft(finalData);
                    await db.doc(PUBLIC_PLANNING_PATH).set(finalData);
                    setFeedbackType('success');
                    setFeedback('Planejamento salvo e atualizado com sucesso!');
                    openDashboard();
                } catch (err) {
                    console.error("Erro ao publicar:", err);
                    setFeedbackType('error');
                    setFeedback('ERRO: Falha na publicação. Verifique as permissões do Firestore.');
                }
            };

            const handleLogout = () => {
                auth.signOut().catch(e => console.error("Erro ao deslogar:", e));
            };
            
            const clearForm = () => {
                const dateString = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}-${String(new Date().getDate()).padStart(2, '0')}`;
                const clearedData = { data: dateString, turno: 'TURNO: A', setores: [] };
                setSectorsState({});
                setContextState({ data: dateString, turno: 'TURNO: A' });
                setFeedback('Formulário limpo.');
                saveDraft(clearedData);
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white p-3 shadow-sm text-gray-800 border-b border-gray-200 sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <h1 className="text-lg sm:text-xl font-semibold flex items-center">
                                <span className="hidden sm:inline mr-2">📋</span>
                                <span className="hidden md:inline">Planejamento Operacional - Indústria</span>
                                <span className="md:hidden">Plan. Operacional</span>
                            </h1>
                            <div className="flex items-center space-x-3">
                                <span className="text-sm hidden md:block">Usuário: {currentUser.email}</span>
                                <button 
                                    onClick={handleLogout} 
                                    className="bg-red-500 hover:bg-red-600 text-white font-medium py-1 px-3 rounded-md text-sm"
                                >
                                    Sair
                                </button>
                            </div>
                        </div>
                    </header>
                    
                    <form onSubmit={handlePublish} className="max-w-7xl mx-auto p-4 sm:p-6">
                        
                        {feedback && (
                            <div className={`fixed-feedback p-3 mb-4 rounded-md text-sm font-medium ${feedbackType === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                {feedback}
                            </div>
                        )}

                        <div className="flex flex-wrap justify-start items-center gap-4 mb-6 p-3 bg-gray-100 rounded-md border border-gray-200">
                            <div className="flex items-center space-x-2">
                                <label htmlFor="data-ref" className="font-semibold text-gray-700 text-sm">Data:</label>
                                <input
                                    type="date"
                                    id="data-ref"
                                    required
                                    value={contextState.data || ''}
                                    onChange={(e) => setContextState(prev => ({...prev, data: e.target.value}))}
                                    className="p-2 rounded-md border border-gray-300 bg-white shadow-sm text-sm"
                                />
                            </div>
                            <div className="flex items-center space-x-2">
                                <label className="font-semibold text-gray-700 text-sm">Turno:</label>
                                <div className="bg-gray-200 p-1 rounded-full flex items-center space-x-1">
                                    {['TURNO: A', 'TURNO: B', 'TURNO: C'].map(turnoValue => (
                                        <button
                                            type="button"
                                            key={turnoValue}
                                            onClick={() => setContextState(prev => ({...prev, turno: turnoValue}))}
                                            className={`px-5 py-1 text-sm font-semibold rounded-full transition-colors duration-200 ease-in-out ${
                                                contextState.turno === turnoValue
                                                    ? 'bg-white text-blue-700 shadow'
                                                    : 'bg-transparent text-gray-500 hover:bg-gray-300/50'
                                            }`}
                                        >
                                            {turnoValue.replace('TURNO: ', '')}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                            {SECTORS_LIST.map(sector => (
                                <div key={sector.id} className="bg-white p-4 shadow-md rounded-lg border border-gray-200">
                                    <h2 className="text-lg font-semibold text-gray-800 mb-2">{sector.name}</h2>
                                    
                                    <label className="block text-xs font-medium text-gray-600 mb-1">
                                        Status e Próximos Passos
                                    </label>
                                    <textarea
                                        id={`status-${sector.id}`}
                                        placeholder="Descreva o status do setor..."
                                        value={sectorsState[sector.id]?.status || ''}
                                        onChange={(e) => setSectorsState(prev => ({...prev, [sector.id]: {...prev[sector.id], status: e.target.value}}))}
                                        className="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 shadow-inner text-sm"
                                        rows="4"
                                    />
                                    
                                    <label className="block mt-3 text-xs font-medium text-gray-600">
                                        Prioridade
                                    </label>
                                    <select
                                        id={`priority-${sector.id}`}
                                        value={sectorsState[sector.id]?.prioridade || 'NORMAL'}
                                        onChange={(e) => setSectorsState(prev => ({...prev, [sector.id]: {...prev[sector.id], prioridade: e.target.value}}))}
                                        className="w-full mt-1 border-gray-300 rounded-md shadow-sm text-sm"
                                    >
                                        <option value="NORMAL">NORMAL</option>
                                        <option value="BAIXA">BAIXA</option>
                                        <option value="MÉDIA">MÉDIA</option>
                                        <option value="ALTA">ALTA</option>
                                    </select>
                                </div>
                            ))}
                        </div>

                        <div className="mt-8 flex flex-col sm:flex-row sm:justify-center items-center gap-3 px-4 sm:px-0">
                            <button
                                type="button"
                                onClick={clearForm}
                                className="w-full sm:w-auto px-6 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-100 transition duration-150 shadow-sm font-semibold"
                            >
                                Limpar
                            </button>
                            <button
                                type="submit"
                                className="w-full sm:w-auto px-6 py-2 rounded-md text-white bg-blue-600 hover:bg-blue-700 transition duration-150 shadow-sm font-semibold"
                            >
                                Salvar e Atualizar
                            </button>
                            <button
                                type="button"
                                onClick={handlePublishAndOpen}
                                className="w-full sm:w-auto px-6 py-2 rounded-md text-white bg-green-600 hover:bg-green-700 transition duration-150 shadow-sm font-semibold"
                            >
                                Salvar e Abrir Dashboard
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        // --- Dashboard (Interface B) ---
        const DashboardViewer = () => {
            const { db } = useContext(AuthContext);
            const [planningData, setPlanningData] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                console.log("DashboardViewer: Initializing listener for PUBLIC_PLANNING_PATH");
                if (!db) {
                    setLoading(false);
                    console.log("DashboardViewer: Firestore DB not available.");
                    return;
                }
                
                const unsubscribe = db.doc(PUBLIC_PLANNING_PATH).onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        setPlanningData(data);
                        console.log("DashboardViewer: Received data:", data);
                    } else {
                        setPlanningData(null);
                        console.log("DashboardViewer: Document does not exist.");
                    }
                    setLoading(false);
                }, (error) => {
                    console.error("DashboardViewer: Firestore listener error:", error);
                    setLoading(false);
                });

                return () => {
                    console.log("DashboardViewer: Unsubscribing from Firestore listener.");
                    unsubscribe();
                };
            }, [db]);

            const handleToggleComplete = async (sectorId, activityIndex) => {
                const docRef = db.doc(PUBLIC_PLANNING_PATH);
                try {
                    const docSnap = await docRef.get();
                    if (!docSnap.exists) return;

                    const currentData = docSnap.data();
                    const updatedSetores = currentData.setores.map(sector => {
                        if (sector.id === sectorId) {
                            const updatedAtividades = sector.atividades.map((atividade, idx) => {
                                if (idx === activityIndex) {
                                    return { ...atividade, completed: !atividade.completed };
                                }
                                return atividade;
                            });
                            return { ...sector, atividades: updatedAtividades };
                        }
                        return sector;
                    });

                    await docRef.update({ setores: updatedSetores });

                } catch (error) {
                    console.error("Erro ao atualizar status da atividade:", error);
                }
            };

            const handleObservationChange = async (sectorId, newObservation) => {
                const docRef = db.doc(PUBLIC_PLANNING_PATH);
                try {
                    const docSnap = await docRef.get();
                    if (!docSnap.exists) return;

                    const currentData = docSnap.data();
                    const updatedSetores = currentData.setores.map(sector => {
                        if (sector.id === sectorId) {
                            return { ...sector, observacoes: newObservation };
                        }
                        return sector;
                    });

                    await docRef.update({ setores: updatedSetores });

                } catch (error) {
                    console.error("Erro ao atualizar observação:", error);
                }
            };

            const getPriorityClass = (priority) => {
                const p = priority ? priority.toUpperCase() : 'NORMAL';
                switch (p) {
                    case 'ALTA': return 'border-red-500';
                    case 'MÉDIA': return 'border-orange-400';
                    case 'BAIXA': return 'border-yellow-400';
                    default: return 'border-gray-300';
                }
            };
            
            const getPriorityBadgeClass = (priority) => {
                const p = priority ? priority.toUpperCase() : 'NORMAL';
                switch (p) {
                    case 'ALTA': return 'bg-red-100 text-red-800';
                    case 'MÉDIA': return 'bg-orange-100 text-orange-800';
                    case 'BAIXA': return 'bg-yellow-100 text-yellow-800';
                    default: return 'bg-gray-100 text-gray-800';
                }
            };

            const sortedSetores = planningData?.setores ? [...planningData.setores].sort((a, b) => {
                const order = { 'ALTA': 1, 'MÉDIA': 2, 'BAIXA': 3, 'NORMAL': 4 };
                return (order[a.prioridade] || 4) - (order[b.prioridade] || 4);
            }) : [];

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <p className="text-lg font-semibold text-gray-500">Carregando Dashboard...</p>
                    </div>
                );
            }
            
            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white p-3 shadow-sm text-gray-800 border-b border-gray-200 sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <h1 className="text-lg sm:text-xl font-semibold flex items-center">
                                <span className="hidden sm:inline mr-2">📊</span>
                                <span className="hidden md:inline">Dashboard COI - Planejamento</span>
                                <span className="md:hidden">Dashboard COI</span>
                            </h1>
                            <div className="text-right text-xs sm:text-sm">
                                <p className="font-semibold text-green-600">Status: Conectado</p>
                                <p className="hidden sm:block">Última Atualização: {planningData ? new Date(planningData.timestamp).toLocaleTimeString('pt-BR') : 'N/A'}</p>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto p-4 sm:p-6">
                        <div className="bg-gray-100 p-3 rounded-md border border-gray-200 mb-6 text-center">
                            <p className="mt-1 text-sm text-gray-600">
                                Data: <span className="font-semibold text-blue-700">{planningData?.data || 'N/A'}</span> | 
                                Turno: <span className="font-semibold text-blue-700">{planningData?.turno || 'N/A'}</span>
                            </p>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                            {sortedSetores.length > 0 ? (
                                sortedSetores.map(sector => (
                                    <div key={sector.id} className={`bg-white p-4 rounded-md shadow-sm border-l-4 ${getPriorityClass(sector.prioridade)}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="text-base font-bold text-gray-800">{sector.nome}</h3>
                                            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${getPriorityBadgeClass(sector.prioridade)}`}>
                                                {sector.prioridade}
                                            </span>
                                        </div>
                                        <div className="mt-2">
                                            {sector.atividades && sector.atividades.length > 0 ? (
                                                sector.atividades.map((atividade, index) => (
                                                    <div key={index} className="flex items-center mt-1">
                                                        <input
                                                            type="checkbox"
                                                            checked={atividade.completed || false}
                                                            onChange={() => handleToggleComplete(sector.id, index)}
                                                            className="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                                                        />
                                                        <span className={`ml-2 text-sm text-gray-700 ${atividade.completed ? 'line-through text-gray-500' : ''}`}>
                                                            {atividade.text}
                                                        </span>
                                                    </div>
                                                ))
                                            ) : (
                                                <p className="text-sm text-gray-700">Nenhum status fornecido.</p>
                                            )}
                                        </div>
                                        <div className="mt-4">
                                            <label className="block text-xs font-medium text-gray-600 mb-1">
                                                Observações
                                            </label>
                                            <textarea
                                                placeholder="Adicione observações sobre as atividades..."
                                                value={sector.observacoes || ''}
                                                onChange={(e) => handleObservationChange(sector.id, e.target.value)}
                                                className="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 shadow-inner text-sm"
                                                rows="3"
                                            />
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <p className="text-center text-gray-500 p-6 col-span-full">Nenhum planejamento disponível.</p>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        // --- Componente Principal (Roteador) ---
        const App = () => {
            const { currentUser, loading } = useContext(AuthContext);

            const urlParams = new URLSearchParams(window.location.search);
            const isDashboardPage = urlParams.get('page') === 'dashboard';

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <p className="text-lg font-semibold text-gray-600">Iniciando...</p>
                    </div>
                );
            }

            if (isDashboardPage) {
                return <DashboardViewer />;
            }
            
            if (!currentUser) {
                return <LoginScreen />;
            }

            return <PlanningForm />;
        };

        const Main = () => (
            <AuthProvider>
                <App />
            </AuthProvider>
        );

        ReactDOM.render(<Main />, document.getElementById('root'));
    </script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</body>
</html>
