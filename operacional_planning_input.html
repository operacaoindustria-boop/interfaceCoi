<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Planejamento Operacional - Entrada</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:'Inter',sans-serif;background-color:#f0f4f8;color:#333}.header-bg{background-color:#0d2545;color:white;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1)}.card{transition:box-shadow .2s;border-radius:8px}.card:hover{box-shadow:0 5px 15px rgba(0,0,0,0.08)}textarea{resize:vertical;min-height:120px;box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}.section-name{color:#0d2545}.priority-select{border-radius:6px;border:1px solid #ccc;padding:6px}#feedback-message{transition:opacity .5s,transform .5s}.fade-in{opacity:1;transform:translateY(0)}.fade-out{opacity:0;transform:translateY(10px)}</style></head><body class="bg-gray-50 min-h-screen"><form id="transmission-form"><div id="status-storage" class="bg-green-600 text-white p-3 text-center font-bold">✅ PRONTO PARA SALVAR (ARMAZENAMENTO LOCAL ATIVO)</div><header class="header-bg p-4 sticky top-0 z-10"><h1 class="text-3xl font-extrabold flex items-center justify-center"><span class="mr-3">📋</span> Planejamento Operacional</h1><div class="flex flex-wrap justify-center gap-6 mt-4 p-3 bg-white/10 rounded-lg"><div class="flex items-center space-x-2"><label for="data-ref" class="font-semibold">Data:</label><input type="date" id="data-ref" required class="p-2 rounded-md text-gray-900 focus:ring-indigo-500 focus:border-indigo-500"></div><div class="flex items-center space-x-2"><label for="turno-ref" class="font-semibold">Turno:</label><select id="turno-ref" required class="p-2 rounded-md text-gray-900 focus:ring-indigo-500 focus:border-indigo-500"><option value="TURNO 1">Turno 1</option><option value="TURNO 2">Turno 2</option><option value="TURNO 3">Turno 3</option></select></div></div></header><main class="max-w-6xl mx-auto p-6"><div id="feedback-message" class="fade-out" style="opacity: 0;"></div><div class="grid grid-cols-1 md:grid-cols-2 gap-8"><div class="card bg-white p-6 shadow-lg"><h2 class="section-name text-2xl font-bold mb-4">MOEGAS/RECEPÇÃO</h2><textarea id="status-moegas-recepcao" placeholder="Descreva o status e os próximos passos para o setor." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea><label for="priority-moegas-recepcao" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label><select id="priority-moegas-recepcao" class="priority-select w-full mt-1"><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option><option value="MÉDIA">Média</option><option value="ALTA">Alta</option></select></div><div class="card bg-white p-6 shadow-lg"><h2 class="section-name text-2xl font-bold mb-4">SILOS E PRÉ-SECAGENS</h2><textarea id="status-silos-e-pre-secagens" placeholder="Descreva o status e os próximos passos para o setor." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea><label for="priority-silos-e-pre-secagens" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label><select id="priority-silos-e-pre-secagens" class="priority-select w-full mt-1"><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option><option value="MÉDIA">Média</option><option value="ALTA">Alta</option></select></div><div class="card bg-white p-6 shadow-lg"><h2 class="section-name text-2xl font-bold mb-4">SILO PULMÃO</h2><textarea id="status-silo-pulmao" placeholder="Descreva o status e os próximos passos para o setor." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea><label for="priority-silo-pulmao" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label><select id="priority-silo-pulmao" class="priority-select w-full mt-1"><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option><option value="MÉDIA">Média</option><option value="ALTA">Alta</option></select></div><div class="card bg-white p-6 shadow-lg"><h2 class="section-name text-2xl font-bold mb-4">SILOS DE REPASSE</h2><textarea id="status-silos-de-repasse" placeholder="Descreva o status e os próximos passos para o setor." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea><label for="priority-silos-de-repasse" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label><select id="priority-silos-de-repasse" class="priority-select w-full mt-1"><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option><option value="MÉDIA">Média</option><option value="ALTA">Alta</option></select></div><div class="card bg-white p-6 shadow-lg"><h2 class="section-name text-2xl font-bold mb-4">BENEFICIAMENTO</h2><textarea id="status-beneficiamento" placeholder="Descreva o status e os próximos passos para o setor." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea><label for="priority-beneficiamento" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label><select id="priority-beneficiamento" class="priority-select w-full mt-1"><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option><option value="MÉDIA">Média</option><option value="ALTA">Alta</option></select></div><div class="card bg-white p-6 shadow-lg"><h2 class="section-name text-2xl font-bold mb-4">ENSAQUE</h2><textarea id="status-ensaque" placeholder="Descreva o status e os próximos passos para o setor." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea><label for="priority-ensaque" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label><select id="priority-ensaque" class="priority-select w-full mt-1"><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option><option value="MÉDIA">Média</option><option value="ALTA">Alta</option></select></div><div class="card bg-white p-6 shadow-lg"><h2 class="section-name text-2xl font-bold mb-4">MARCOLD</h2><textarea id="status-marcold" placeholder="Descreva o status e os próximos passos para o setor." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea><label for="priority-marcold" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label><select id="priority-marcold" class="priority-select w-full mt-1"><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option><option value="MÉDIA">Média</option><option value="ALTA">Alta</option></select></div><div class="card bg-white p-6 shadow-lg"><h2 class="section-name text-2xl font-bold mb-4">GRANELEIRO ADRIANA</h2><textarea id="status-graneleiro-adriana" placeholder="Descreva o status e os próximos passos para o setor." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea><label for="priority-graneleiro-adriana" class="block mt-3 text-sm font-medium text-gray-700">Prioridade de Ação:</label><select id="priority-graneleiro-adriana" class="priority-select w-full mt-1"><option value="NORMAL">Normal</option><option value="BAIXA">Baixa</option><option value="MÉDIA">Média</option><option value="ALTA">Alta</option></select></div></div><div class="mt-8 flex justify-center space-x-4"><button type="button" id="clear-form-btn" class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 bg-white hover:bg-gray-100 transition duration-150 shadow-sm font-semibold">Limpar Formulário</button><button type="submit" class="px-8 py-3 rounded-lg text-white bg-green-600 hover:bg-green-700 transition duration-150 shadow-lg font-bold">Salvar e Atualizar Planejamento</button></div></main></form><script>const STORAGE_KEY='PMP_OPERATIONAL_PLAN';const SECTORS=['MOEGAS/RECEPÇÃO','SILOS E PRÉ-SECAGENS','SILO PULMÃO','SILOS DE REPASSE','BENEFICIAMENTO','ENSAQUE','MARCOLD','GRANELEIRO ADRIANA'];function showFeedback(m,e=false){const e=document.getElementById('feedback-message');e.textContent=m;e.className=`p-3 rounded-md mt-4 font-semibold text-center fade-in ${e?'bg-red-100 text-red-800':'bg-green-100 text-green-800'}`;setTimeout(()=>{e.className='fade-out';setTimeout(()=>{e.textContent='',e.style.opacity=0},500)},5e3)}function getCurrentDateString(){const e=new Date,t=e.getFullYear(),o=String(e.getMonth()+1).padStart(2,'0'),n=String(e.getDate()).padStart(2,'0');return`${t}-${o}-${n}`}function collectFormData(t){const o=document.getElementById('data-ref').value,n=document.getElementById('turno-ref').value;if(t&&(!o||!n))return null;const r=SECTORS.map(e=>{const t=e.toLowerCase().replace(/[\s\/,]+/g,'_').replace(/_/g,'-'),o=document.getElementById(`status-${t}`),n=document.getElementById(`priority-${t}`),r=o?o.value.trim():'',s=n?n.value.toUpperCase():'NORMAL';if(t&&!r)return null;return{id:t,nome:e,status:r,prioridade:s}}).filter(e=>null!==e);if(t&&0===r.length)return null;return{timestamp:Date.now(),data:o,turno:n,setores:r}}function loadLastStatusFromLocal(){const e=localStorage.getItem(STORAGE_KEY);if(e)try{const t=JSON.parse(e);t.setores.forEach(e=>{if(document.getElementById(`status-${e.id}`))document.getElementById(`status-${e.id}`).value=e.status||'';if(document.getElementById(`priority-${e.id}`))document.getElementById(`priority-${e.id}`).value=e.prioridade||'NORMAL'}),showFeedback("Último rascunho de trabalho carregado.",!1)}catch(e){console.error("Erro ao carregar rascunho local:",e)}}function saveStatusLocal(){const e=collectFormData(!1);e&&localStorage.setItem(STORAGE_KEY,JSON.stringify(e))}function handleTransmission(e){e.preventDefault();const t=collectFormData(!0);t?("function"==typeof localStorage.setItem?localStorage.setItem(STORAGE_KEY,JSON.stringify(t)):console.error("localStorage n\xe3o \xe9 suportado."),showFeedback("🚀 Planejamento SALVO LOCALMENTE! Dashboard COI ser\xe1 atualizado.",!1)):showFeedback("⚠️ Por favor, preencha a Data, o Turno e pelo menos um Status de Setor.",!0)}function clearForm(){SECTORS.forEach(e=>{const t=e.toLowerCase().replace(/[\s\/,]+/g,'_').replace(/_/g,'-');document.getElementById(`status-${t}`)&&document.getElementById(`status-${t}`).value='',document.getElementById(`priority-${t}`)&&document.getElementById(`priority-${t}`).value='NORMAL'}),document.getElementById('data-ref').value=getCurrentDateString(),document.getElementById('turno-ref').value='TURNO 1',showFeedback("Formulário limpo e pronto para um novo preenchimento.",!1),localStorage.removeItem(STORAGE_KEY)}document.addEventListener('DOMContentLoaded',()=>{document.getElementById('data-ref').value=getCurrentDateString(),document.getElementById('transmission-form').addEventListener('submit',handleTransmission),document.getElementById('clear-form-btn').addEventListener('click',clearForm),document.getElementById('transmission-form').addEventListener('input',saveStatusLocal),loadLastStatusFromLocal()})</script></body></html>
