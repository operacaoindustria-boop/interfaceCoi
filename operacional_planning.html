<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Planejamento Operacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --priority-alta: #ef4444;
            --priority-media: #f97316;
            --priority-baixa: #eab308;
            --priority-normal: #3b82f6;
        }
        .priority-alta { border-color: var(--priority-alta); }
        .priority-media { border-color: var(--priority-media); }
        .priority-baixa { border-color: var(--priority-baixa); }
        .priority-normal { border-color: var(--priority-normal); }

        .bg-priority-alta { background-color: var(--priority-alta); }
        .bg-priority-media { background-color: var(--priority-media); }
        .bg-priority-baixa { background-color: var(--priority-baixa); }
        .bg-priority-normal { background-color: var(--priority-normal); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Container Principal -->
    <div id="app-container" class="container mx-auto p-4 md:p-8">



        <!-- APLICAÇÃO PRINCIPAL (Produtor & Consumidor) -->
        <div id="main-app-view" class="hidden">
            
            <!-- MÓDULO A: Interface de Entrada (Produtor) -->
            <div id="producer-view" class="hidden bg-white p-6 rounded-lg shadow-md mb-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-700">Módulo de Entrada - Planejamento Operacional</h2>
                    <button id="logout-button" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">Sair</button>
                </div>
                <form id="planning-form">
                    <!-- Campos de Contexto -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label for="data" class="block text-sm font-medium text-gray-600 mb-1">Data</label>
                            <input type="date" id="data" name="data" class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label for="turno" class="block text-sm font-medium text-gray-600 mb-1">Turno</label>
                            <select id="turno" name="turno" class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                                <option value="">Selecione o Turno</option>
                                <option value="TURNO 1">TURNO 1</option>
                                <option value="TURNO 2">TURNO 2</option>
                                <option value="TURNO 3">TURNO 3</option>
                            </select>
                        </div>
                    </div>

                    <!-- Campos de Setor -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <!-- Gerado dinamicamente -->
                    </div>

                    <!-- Botão de Envio -->
                    <div class="mt-8 text-center">
                        <button type="submit" class="bg-green-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-green-700 transition duration-300">
                            Salvar e Atualizar Planejamento
                        </button>
                    </div>
                </form>
                <div id="feedback-message" class="mt-4 text-center text-green-600 font-semibold"></div>
            </div>

            <!-- MÓDULO B: Dashboard COI (Consumidor) -->
            <div id="consumer-view" class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-700 mb-2">Dashboard COI - Status em Tempo Real</h2>
                        <p class="text-gray-500">Atualizado em: <span id="last-update-timestamp" class="font-semibold">--:--:--</span></p>
                    </div>
                    <a href="index_interfaceCoi.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                        Controle de Descarga dos Silos
                    </a>
                </div>
                <div id="dashboard-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Cards de status serão inseridos aqui -->
                    <p id="no-data-message" class="col-span-full text-center text-gray-500">Aguardando dados do planejamento...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DO FIREBASE ---
        // Substitua com suas credenciais do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXX",
            authDomain: "your-project-id.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project-id.appspot.com",
            messagingSenderId: "your-sender-id",
            appId: "1:your-sender-id:web:your-app-id"
        };

        // --- INICIALIZAÇÃO DO FIREBASE ---
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const planningDocRef = db.collection("planejamento_coi").doc("status_publico");

        // --- ELEMENTOS DA UI ---

        const logoutButton = document.getElementById('logout-button');
        const planningForm = document.getElementById('planning-form');
        const feedbackMessage = document.getElementById('feedback-message');
        const dashboardCards = document.getElementById('dashboard-cards');
        const lastUpdateTimestamp = document.getElementById('last-update-timestamp');
        const noDataMessage = document.getElementById('no-data-message');

        const priorities = ['NORMAL', 'BAIXA', 'MÉDIA', 'ALTA'];
        const priorityClasses = {
            'ALTA': { border: 'priority-alta', bg: 'bg-priority-alta' },
            'MÉDIA': { border: 'priority-media', bg: 'bg-priority-media' },
            'BAIXA': { border: 'priority-baixa', bg: 'bg-priority-baixa' },
            'NORMAL': { border: 'priority-normal', bg: 'bg-priority-normal' }
        };

        // --- LÓGICA DE AUTENTICAÇÃO (MÓDULO A) ---
        auth.onAuthStateChanged(user => {
            if (user) {
                mainAppView.classList.remove('hidden');
                producerView.classList.remove('hidden');
            } else {
                window.location.href = 'index.html';
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password)
                .catch(error => {
                    loginError.textContent = 'Email ou senha inválidos.';
                    loginError.classList.remove('hidden');
                });
        });

        logoutButton.addEventListener('click', () => {
            auth.signOut();
        });

        // --- LÓGICA DE ENTRADA DE DADOS (MÓDULO A) ---
        function createSectorInputs() {
            const container = planningForm.querySelector('.grid.grid-cols-1');
            for (let i = 1; i <= 8; i++) {
                const sectorHTML = `
                    <div class="border-l-4 border-gray-200 p-4 rounded-r-lg bg-gray-50">
                        <h3 class="font-bold text-gray-700 mb-2">Setor ${i}</h3>
                        <div class="mb-2">
                            <label for="status-${i}" class="text-sm text-gray-600">Descrição do Status</label>
                            <textarea id="status-${i}" name="status-${i}" rows="3" class="w-full mt-1 p-2 border rounded-md text-sm"></textarea>
                        </div>
                        <div>
                            <label for="priority-${i}" class="text-sm text-gray-600">Prioridade</label>
                            <select id="priority-${i}" name="priority-${i}" class="w-full mt-1 p-2 border rounded-md text-sm">
                                ${priorities.map(p => `<option value="${p}">${p}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;
                container.innerHTML += sectorHTML;
            }
        }
        createSectorInputs();

        planningForm.addEventListener('submit', (e) => {
            e.preventDefault();
            feedbackMessage.textContent = '';

            const formData = new FormData(planningForm);
            const data = {
                data: formData.get('data'),
                turno: formData.get('turno'),
                setores: [],
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            let hasAtLeastOneStatus = false;
            const submissionTime = Date.now();
            for (let i = 1; i <= 8; i++) {
                const status = formData.get(`status-${i}`);
                if (status && status.trim() !== '') {
                    hasAtLeastOneStatus = true;
                    data.setores.push({
                        id: `${submissionTime}-${i}`, // ID Único
                        nome: `Setor ${i}`,
                        status: status,
                        prioridade: formData.get(`priority-${i}`)
                    });
                }
            }

            if (!data.data || !data.turno || !hasAtLeastOneStatus) {
                feedbackMessage.textContent = 'Erro: Preencha Data, Turno e pelo menos um Status.';
                feedbackMessage.classList.remove('text-green-600');
                feedbackMessage.classList.add('text-red-500');
                return;
            }

            planningDocRef.set(data)
                .then(() => {
                    feedbackMessage.textContent = 'Planejamento enviado com sucesso!';
                    feedbackMessage.classList.remove('text-red-500');
                    feedbackMessage.classList.add('text-green-600');
                    planningForm.reset();
                })
                .catch(error => {
                    feedbackMessage.textContent = `Erro ao enviar: ${error.message}`;
                    feedbackMessage.classList.remove('text-green-600');
                    feedbackMessage.classList.add('text-red-500');
                });
        });

        // --- LÓGICA DO DASHBOARD EM TEMPO REAL (MÓDULO B) ---
        const handleToggleSubActivity = async (sectorId, activityIndex) => {
            try {
                const doc = await planningDocRef.get();
                if (!doc.exists) return;

                const data = doc.data();
                const updatedSetores = data.setores.map(s => {
                    if (s.id === sectorId) {
                        const activities = s.status.split('\n').filter(act => act.trim() !== '');
                        let completedMask = s.completed_mask || Array(activities.length).fill(false);
                        
                        if (completedMask.length !== activities.length) {
                            const newMask = Array(activities.length).fill(false);
                            for(let i = 0; i < Math.min(completedMask.length, newMask.length); i++) {
                                newMask[i] = completedMask[i];
                            }
                            completedMask = newMask;
                        }

                        completedMask[activityIndex] = !completedMask[activityIndex];
                        
                        return { ...s, completed_mask: completedMask };
                    }
                    return s;
                });

                await planningDocRef.update({ setores: updatedSetores });
            } catch (error) {
                console.error("Erro ao atualizar status da sub-atividade:", error);
                alert("Não foi possível atualizar a atividade. Verifique o console para mais detalhes.");
            }
        };

        planningDocRef.onSnapshot((doc) => {
            if (doc.exists) {
                noDataMessage.classList.add('hidden');
                const data = doc.data();
                const setores = data.setores || [];
                
                const updateTime = data.timestamp ? (data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp)) : new Date();
                lastUpdateTimestamp.textContent = updateTime.toLocaleTimeString('pt-BR');

                const priorityOrder = { 'ALTA': 4, 'MÉDIA': 3, 'BAIXA': 2, 'NORMAL': 1 };
                setores.sort((a, b) => (priorityOrder[b.prioridade] || 0) - (priorityOrder[a.prioridade] || 0));

                dashboardCards.innerHTML = '';
                setores.forEach(setor => {
                    const pClass = priorityClasses[setor.prioridade] || priorityClasses['NORMAL'];
                    
                    const card = document.createElement('div');
                    card.className = `bg-white rounded-lg shadow-sm border-l-8 ${pClass.border} p-4 flex flex-col transition-all duration-300`;

                    const header = document.createElement('div');
                    header.className = 'flex justify-between items-center mb-2';
                    
                    const title = document.createElement('h3');
                    title.className = 'text-lg font-bold text-gray-800';
                    title.textContent = setor.nome;

                    const priorityBadge = document.createElement('span');
                    priorityBadge.className = `text-white text-xs font-bold uppercase px-3 py-1 rounded-full ${pClass.bg}`;
                    priorityBadge.textContent = setor.prioridade;

                    header.appendChild(title);
                    header.appendChild(priorityBadge);
                    card.appendChild(header);

                    const activitiesContainer = document.createElement('div');
                    activitiesContainer.className = 'flex-grow mt-2';

                    const activities = setor.status.split('\n').filter(act => act.trim() !== '');
                    let completedMask = setor.completed_mask || [];
                    if (completedMask.length !== activities.length) {
                        completedMask = Array(activities.length).fill(false);
                    }

                    if (activities.length > 0) {
                        activities.forEach((activity, index) => {
                            const isActivityCompleted = completedMask[index] === true;

                            const activityWrapper = document.createElement('div');
                            activityWrapper.className = 'flex items-center justify-between mt-2';
                            
                            const label = document.createElement('label');
                            label.className = 'flex items-center space-x-3 cursor-pointer';
                            
                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.checked = isActivityCompleted;
                            checkbox.className = 'h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 flex-shrink-0';
                            checkbox.onchange = () => handleToggleSubActivity(setor.id, index);

                            const span = document.createElement('span');
                            span.className = `text-sm ${isActivityCompleted ? 'text-gray-500 line-through' : 'text-gray-700'}`;
                            span.textContent = activity;

                            label.appendChild(checkbox);
                            label.appendChild(span);
                            activityWrapper.appendChild(label);

                            if (isActivityCompleted) {
                                const completedText = document.createElement('span');
                                completedText.className = 'text-green-600 font-semibold text-xs ml-2 flex-shrink-0';
                                completedText.textContent = 'Concluída';
                                activityWrapper.appendChild(completedText);
                            }
                            
                            activitiesContainer.appendChild(activityWrapper);
                        });
                    } else {
                        const p = document.createElement('p');
                        p.className = 'text-gray-600';
                        p.textContent = setor.status;
                        activitiesContainer.appendChild(p);
                    }

                    card.appendChild(activitiesContainer);
                    
                    const allCompleted = completedMask.length > 0 && completedMask.every(c => c === true);
                    if (allCompleted) {
                        card.classList.add('opacity-60');
                    }

                    dashboardCards.appendChild(card);
                });

            } else {
                noDataMessage.classList.remove('hidden');
                dashboardCards.innerHTML = '';
                lastUpdateTimestamp.textContent = '--:--:--';
            }
        }, (error) => {
            console.error("Erro ao ouvir o banco de dados: ", error);
            noDataMessage.textContent = 'Erro de conexão com o dashboard.';
            noDataMessage.classList.remove('hidden');
        });

    </script>
</body>
</html>
