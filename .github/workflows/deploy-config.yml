# Nome do Workflow
name: Configurar e Implantar

on:
  push:
    branches:
      - main  # Altere para 'master' se for o caso do seu branch principal
      
# Permissão para escrever no repositório (necessário para Pages)
permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
      - name: Configurar Credenciais do Firebase
        # Este passo substitui os valores de configuração do Firebase com os Segredos (Secrets)
        run: |
          # 1. Realiza a substituição dos valores preenchidos no firebase_config.js pelos Secrets.
          # Isso garante a injeção segura das credenciais no momento da implantação.
          sed -i "s|apiKey: \"AIzaSyB_ZscXHOoNP1Xkm-C6WLqhwEFcTsBk3GQ\"|apiKey: \"${{ secrets.FIREBASE_API_KEY }}\"|g" firebase_config.js
          sed -i "s|authDomain: \"integracaocoi.firebaseapp.com\"|authDomain: \"${{ secrets.FIREBASE_AUTH_DOMAIN }}\"|g" firebase_config.js
          sed -i "s|projectId: \"integracaocoi\"|projectId: \"${{ secrets.FIREBASE_PROJECT_ID }}\"|g" firebase_config.js
          sed -i "s|storageBucket: \"integracaocoi.firebasestorage.app\"|storageBucket: \"${{ secrets.FIREBASE_STORAGE_BUCKET }}\"|g" firebase_config.js
          sed -i "s|messagingSenderId: \"177203745489\"|messagingSenderId: \"${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}\"|g" firebase_config.js
          sed -i "s|appId: \"1:177203745489:web:b86bbc4e96830e06032bf0\"|appId: \"${{ secrets.FIREBASE_APP_ID }}\"|g" firebase_config.js
          
          echo "✅ firebase_config.js configurado com Secrets."
          
          # 2. Correção do caminho de importação (de './' para '../')
          FILE_LIST="operacional_planning_input.html operational_dashboard_viewer.html"
          for file in $FILE_LIST; do
              # Garante que o caminho de importação é '../firebase_config.js' se o arquivo estiver em subpasta
              sed -i "s|import { FIREBASE_CONFIG, APP_ID_FALLBACK } from './firebase_config.js'|import { FIREBASE_CONFIG, APP_ID_FALLBACK } from '../firebase_config.js'|g" $file || true
          done

      - name: Configurar e implantar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ # Assumindo que seus arquivos HTML estão na raiz
          force_orphan: true 
