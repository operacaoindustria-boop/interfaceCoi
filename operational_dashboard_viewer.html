<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard do COI (Visualização em Tempo Real)</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:'Inter',sans-serif;background-color:#f0f4f8;color:#333}.header-bg{background-color:#0d2545;color:white;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1)}.card{transition:transform .2s,box-shadow .2s;border-radius:8px}.card:hover{transform:translateY(-2px);box-shadow:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -4px rgba(0,0,0,0.1)}.priority-alta{color:#e74c3c;font-weight:700;border-left:5px solid #e74c3c}.priority-media{color:#f39c12;font-weight:700;border-left:5px solid #f39c12}.priority-baixa{color:#2ecc71;font-weight:700;border-left:5px solid #2ecc71}.priority-normal{color:#3498db;font-weight:700;border-left:5px solid #3498db}.status-header{border-bottom:2px solid #ecf0f1;margin-bottom:10px;padding-bottom:8px}.last-update{font-size:.75rem;color:#95a5a6}</style></head><body class="bg-gray-50 min-h-screen"><div id="status-storage" class="bg-blue-600 text-white p-3 text-center font-bold">✅ Conexão Local Ativa (Atualizando a cada 2 segundos)</div><header class="header-bg p-4 flex justify-between items-center sticky top-0 z-10"><h1 class="text-3xl font-extrabold flex items-center"><span class="mr-3">📊</span> Dashboard COI - Planejamento Operacional</h1><div class="flex flex-col text-right text-sm"><span id="status-conexao" class="font-medium text-yellow-400">INICIALIZANDO...</span><span class="mt-1">Data: <span id="data-planejamento" class="font-semibold">N/A</span> | Turno: <span id="turno-planejamento" class="font-semibold">N/A</span> | Última Atualização: <span id="ultima-atualizacao" class="font-semibold">N/A</span></span></div></header><main class="p-8"><div id="dashboard-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"><p class="text-center text-gray-500 p-8 col-span-full">Aguardando dados iniciais...</p></div></main><script>const STORAGE_KEY='PMP_OPERATIONAL_PLAN',REFRESH_RATE_MS=2e3;function getPriorityClass(e){const t=e?e.toLowerCase():'normal';switch(t){case'alta':return'priority-alta bg-white';case'média':return'priority-media bg-white';case'baixa':return'priority-baixa bg-white';default:return'priority-normal bg-white'}}function updateDashboard(e){const t=document.getElementById('dashboard-content');if(!e||!e.setores||0===e.setores.length)return document.getElementById('status-conexao').textContent="AGUARDANDO DADOS...",document.getElementById('status-conexao').className='text-yellow-500 font-bold',void(t.innerHTML='<p class="text-center text-gray-500 p-8 col-span-full">Nenhum dado de planejamento encontrado. Por favor, utilize a Interface de Entrada (A) para transmitir o primeiro status operacional.</p>');document.getElementById('data-planejamento').textContent=e.data||'N/A',document.getElementById('turno-planejamento').textContent=e.turno||'N/A',document.getElementById('ultima-atualizacao').textContent=new Date(e.timestamp).toLocaleString('pt-BR')||'N/A';const o=e.setores||[],n={ALTA:1,MÉDIA:2,BAIXA:3,NORMAL:4};o.sort((e,t)=>{const o=n[e.prioridade.toUpperCase()]||99,r=n[t.prioridade.toUpperCase()]||99;return o-r});let r='';o.forEach(e=>{r+=`<div class="card p-6 ${getPriorityClass(e.prioridade)}"><div class="status-header flex justify-between items-center mb-4"><h3 class="text-xl font-semibold text-[#0d2545]">${e.nome}</h3><span class="text-lg font-bold">Prioridade: ${e.prioridade.toUpperCase()}</span></div><p class="whitespace-pre-wrap text-gray-700 leading-relaxed min-h-[100px]">${e.status}</p></div>`}),t.innerHTML=r,document.getElementById('status-conexao').textContent="CONECTADO: Atualizado",document.getElementById('status-conexao').className='text-green-500 font-bold'}function fetchPlanningData(){const e=localStorage.getItem(STORAGE_KEY);if(e)try{const t=JSON.parse(e);updateDashboard(t)}catch(e){console.error("Erro ao analisar dados locais:",e)}}document.addEventListener('DOMContentLoaded',()=>{fetchPlanningData(),setInterval(fetchPlanningData,REFRESH_RATE_MS)})</script></body></html>
